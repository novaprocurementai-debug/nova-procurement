<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — AI Purchasing Agent</title>

<style>
body{
font-family:Arial;
background:#f4f6f8;
margin:0;
padding:20px;
color:#111
}

main{
max-width:1100px;
margin:auto
}

textarea,input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px
}

textarea{
height:100px
}

button{
padding:11px 16px;
border:0;
border-radius:8px;
background:#111;
color:white;
margin:5px;
cursor:pointer
}

.quote{
background:#06c
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 8px #ddd
}

.small{
font-size:13px;
color:#666
}

.score{
font-size:18px;
font-weight:bold
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:15px
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:left
}

th{
background:#111;
color:white
}

a{
color:#06c
}

.ai{
background:#eef7ff;
border-left:5px solid #06c;
padding:15px;
margin-top:15px;
white-space:pre-wrap
}

@media(max-width:700px){
table{
font-size:12px
}

th,td{
padding:7px
}
}
</style>
</head>

<body>

<main>

<h1>🧠 NOVA</h1>

<p><b>Your AI Purchasing Agent</b></p>

<textarea
id="req"
placeholder="Example: I need 1,000 stainless steel water bottles, 500ml, with my logo, delivered to Dubai.">
</textarea>

<button onclick="search()">
🔎 Search with NOVA
</button>

<div id="status"></div>

<div id="results"></div>

<div id="workspace"></div>

</main>

<script>

let suppliers=[];
let selected=null;
let current="";


async function search(){

current=document.getElementById("req").value.trim();

if(!current)return;

status("🔎 NOVA is searching suppliers...");

results.innerHTML="";
workspace.innerHTML="";

try{

const r=await fetch("/api/search",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
request:current
})
});

const d=await r.json();

if(!d.results?.length){

status("❌ No suppliers found.");

return;
}

suppliers=d.results;

status("✅ "+suppliers.length+" suppliers found");

render();

}catch(e){

status("❌ Search error.");

}

}


function status(x){

document.getElementById("status").innerHTML=x;

}


function render(){

let rows="";

suppliers.forEach((x,i)=>{

rows+=`

<tr>

<td>${i+1}</td>

<td>
<b>${esc(x.title)}</b>
<br>
<a href="${x.url}" target="_blank">
View supplier
</a>
</td>

<td>${x.price||"Not found"}</td>

<td>${x.moq||"Not found"}</td>

<td>${x.leadTime||"Not found"}</td>

<td>
<span class="score">
${x.dealScore||50}/100
</span>
</td>

<td>

<button
class="quote"
onclick="selectSupplier(${i})">
Select
</button>

</td>

</tr>

`;

});

results.innerHTML=`

<h2>Supplier Comparison</h2>

<p class="small">
NOVA shows supplier information found on web sources.
Always verify final price, shipping and terms with the supplier.
</p>

<table>

<thead>

<tr>
<th>#</th>
<th>Supplier</th>
<th>Price</th>
<th>MOQ</th>
<th>Lead</th>
<th>Score</th>
<th>Action</th>
</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

`;

}


function selectSupplier(i){

selected=suppliers[i];

workspace.innerHTML=`

<div class="card">

<h2>🛒 Purchase Workspace</h2>

<h3>${esc(selected.title)}</h3>

<p>
<b>Product:</b>
${esc(current)}
</p>

<p>
<b>Price:</b>
${selected.price||"Not found"}
</p>

<p>
<b>MOQ:</b>
${selected.moq||"Not found"}
</p>

<p>
<b>Lead Time:</b>
${selected.leadTime||"Not found"}
</p>

<p>
<a href="${selected.url}" target="_blank">
🔗 Open Supplier
</a>
</p>

<hr>

<h3>📩 RFQ</h3>

<button
class="quote"
onclick="generateRFQ()">
Generate RFQ
</button>

<div id="rfqBox"></div>

<hr>

<h3>📥 Supplier Reply</h3>

<textarea
id="supplierReply"
placeholder="Paste the supplier's reply here...">
</textarea>

<input
id="supplierOffer"
placeholder="Supplier offer, e.g. $2.80 per unit">

<button
class="quote"
onclick="analyzeSupplier()">
🤖 Analyze & Negotiate
</button>

<div id="aiResult"></div>

</div>

`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}


function generateRFQ(){

const text=

`REQUEST FOR QUOTATION

Product:
${current}

Please provide:

1. Unit price
2. MOQ
3. Shipping cost to Dubai
4. Delivery time
5. Payment terms
6. Sample availability
7. Customization options
8. Packaging options

Please provide your best quotation.

Thank you.`;

document.getElementById("rfqBox").innerHTML=`

<textarea style="height:280px">
${text}
</textarea>

<p class="small">
Copy this RFQ and send it to the supplier.
</p>

`;

}


async function analyzeSupplier(){

const reply=
document.getElementById("supplierReply").value.trim();

const offer=
document.getElementById("supplierOffer").value.trim();

if(!reply && !offer){

document.getElementById("aiResult").innerHTML=
"❌ Enter the supplier's reply or offer.";

return;

}

document.getElementById("aiResult").innerHTML=
"🤖 NOVA AI is analyzing the supplier...";

try{

const r=await fetch("/api/negotiate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

product:current,

supplier:selected.title,

offer:offer,

supplierReply:reply

})

});

const d=await r.json();

if(!d.success){

document.getElementById("aiResult").innerHTML=
"❌ AI error: "+esc(d.error);

return;

}

document.getElementById("aiResult").innerHTML=`

<div class="ai">

<b>🤖 NOVA AI Negotiation Analysis</b>

<br><br>

${esc(d.analysis)}

</div>

`;

}catch(e){

document.getElementById("aiResult").innerHTML=
"❌ Connection error.";

}

}


function esc(x){

return String(x||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}

</script>

</body>
  </html>
