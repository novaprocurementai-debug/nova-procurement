<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — AI Purchasing Agent</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;padding:20px;color:#111}
main{max-width:1100px;margin:auto}
textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
textarea{height:100px}
button{padding:11px 16px;border:0;border-radius:8px;background:#111;color:white;margin:5px;cursor:pointer}
.quote{background:#06c}
.card{background:white;padding:18px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
.small{font-size:13px;color:#666}
.score{font-size:18px;font-weight:bold}
.status{padding:7px 10px;border-radius:20px;background:#eee;font-size:13px}
table{width:100%;border-collapse:collapse;background:white;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
th{background:#111;color:white}
a{color:#06c}
@media(max-width:700px){table{font-size:12px}th,td{padding:7px}}
</style>
</head>
<body>
<main>
<h1>🧠 NOVA</h1>
<p><b>Your AI Purchasing Agent</b></p>

<textarea id="req" placeholder="Example: I need 1,000 stainless steel water bottles, 500ml, with my logo, delivered to Dubai."></textarea>
<button onclick="search()">🔎 Search with NOVA</button>
<div id="status"></div>
<div id="results"></div>
<div id="workspace"></div>
</main>

<script>
let suppliers=[],selected=null,current="";

async function search(){
current=document.getElementById("req").value.trim();
if(!current)return;
status("🔎 NOVA is searching...");
results.innerHTML="";
workspace.innerHTML="";
try{
const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({request:current})});
const d=await r.json();
if(!d.results?.length){status("❌ No suppliers found.");return}
suppliers=d.results;
status("✅ "+suppliers.length+" suppliers found");
render();
}catch(e){status("❌ Search error.")}
}

function status(x){document.getElementById("status").innerHTML=x}

function render(){
let rows="";
suppliers.forEach((x,i)=>{
rows+=`<tr>
<td>${i+1}</td>
<td><b>${esc(x.title)}</b><br><a href="${x.url}" target="_blank">View supplier</a></td>
<td>${x.price||"Not found"}</td>
<td>${x.moq||"Not found"}</td>
<td>${x.leadTime||"Not found"}</td>
<td><span class="score">${x.dealScore||50}/100</span></td>
<td><button class="quote" onclick="select(${i})">Select</button></td>
</tr>`;
});
results.innerHTML=`<h2>Supplier Comparison</h2>
<p class="small">Verify final price, shipping and terms with the supplier.</p>
<table><thead><tr><th>#</th><th>Supplier</th><th>Price</th><th>MOQ</th><th>Lead</th><th>Score</th><th>Action</th></tr></thead>
<tbody>${rows}</tbody></table>`;
}

function select(i){
selected=suppliers[i];
workspace.innerHTML=`<div class="card">
<h2>🛒 Purchase Workspace</h2>
<h3>${esc(selected.title)}</h3>
<p><b>Product:</b> ${esc(current)}</p>
<p>Price: ${selected.price||"Not found"}</p>
<p>MOQ: ${selected.moq||"Not found"}</p>
<p>Lead Time: ${selected.leadTime||"Not found"}</p>
<p><a href="${selected.url}" target="_blank">🔗 Open Supplier</a></p>

<h3>RFQ Status</h3>
<select id="rfqStatus">
<option>Not Contacted</option><option>RFQ Ready</option><option>Sent</option>
<option>Replied</option><option>Negotiating</option><option>Won</option><option>Lost</option>
</select>

<br>
<button class="quote" onclick="rfq()">📩 Generate RFQ</button>
<div id="rfqBox"></div>

<h3>🤖 Negotiation Assistant</h3>
<input id="offer" placeholder="Supplier price, e.g. $2.80">
<button onclick="negotiate()">Analyze Offer</button>
<div id="negotiation"></div>
</div>`;
}

function rfq(){
document.getElementById("rfqBox").innerHTML=`<textarea style="height:280px">REQUEST FOR QUOTATION

Product: ${current}

Please provide:
1. Unit price
2. MOQ
3. Shipping cost to Dubai
4. Delivery time
5. Payment terms
6. Sample availability
7. Customization options
8. Packaging options

Please provide your best quotation.

Thank you.</textarea>`;
document.getElementById("rfqStatus").value="RFQ Ready";
}

function negotiate(){
let p=document.getElementById("offer").value.trim();
if(!p){negotiation.innerHTML="Enter the supplier's price.";return}
negotiation.innerHTML=`<div class="card">
<b>🤖 NOVA Analysis</b>
<p>Supplier offer: <b>${esc(p)}</b></p>
<p>Suggested action: Ask for a better price, lower MOQ, and shipping confirmation.</p>
<p><b>Suggested message:</b></p>
<textarea>Thank you for your quotation. We are interested in this order. Please provide your best possible price, confirm the MOQ, shipping cost and delivery time. If the price is improved, we can proceed quickly.</textarea>
</div>`;
}

function esc(x){
return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
