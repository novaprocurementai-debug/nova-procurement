<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0866f5">
<title>NOVA | العالم بين يديك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--b:#0866f5;--navy:#0c2e63;--ink:#162e50;--muted:#73849e;--line:#e3ebf5;--wash:#f4f8fd;--green:#12966c;--shadow:0 8px 25px #173a650d;--r:16px}
*{box-sizing:border-box}
body{margin:0;font:14px Cairo,Arial,sans-serif;background:var(--wash);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{max-width:100%}
.top{height:68px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.brand{min-width:180px;text-decoration:none;color:var(--b);display:flex;align-items:center}
.brand b{font:900 35px Arial,sans-serif;letter-spacing:-2px}
.brand small{display:block;color:#4d6586;font-size:9px;font-weight:700;letter-spacing:.15px}
.searchbar{height:42px;border:1px solid #d7e3f4;border-radius:11px;display:flex;flex:1;max-width:680px;overflow:hidden;background:#fff}
.searchbar input{min-width:0;flex:1;border:0;outline:0;padding:0 13px}
.searchbar select{width:110px;border:0;border-right:1px solid var(--line);outline:0;background:#f9fbff;padding:0 8px;color:var(--navy)}
.searchbar button{border:0;background:var(--b);color:#fff;padding:0 18px}
.lang{border:1px solid var(--line);background:#f7faff;color:var(--navy);border-radius:10px;padding:8px;max-width:145px}
.topicons{margin-inline-start:auto;display:flex;gap:15px;align-items:center}
.topicons button{border:0;background:transparent;color:#294e80;font-size:17px}
.topicons small{display:block;font-size:9px}
.account{border-inline-start:1px solid var(--line);padding-inline-start:13px;display:flex;align-items:center;gap:9px;background:transparent;border-top:0;border-bottom:0;border-inline-end:0;color:var(--navy);font-weight:800}
.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#e6f0ff;color:var(--b)}
.layout{display:grid;grid-template-columns:222px minmax(0,1fr);max-width:1740px;margin:auto}
.side{background:#fff;border-inline-start:1px solid var(--line);padding:18px 12px;min-height:calc(100vh - 68px);position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.logo-mobile{display:none}
.navcap{font-size:10px;color:#90a0b6;font-weight:800;padding:10px}
.navitem{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#405a7d;border-radius:11px;padding:10px 12px;text-align:start;margin:2px 0;font-weight:700;font-size:12px}
.navitem i{width:20px;text-align:center;color:#6386bb;font-size:15px}
.navitem:hover,.navitem.active{background:#eaf2ff;color:var(--b)}
.navitem.active i{color:var(--b)}
.navpromo{margin-top:20px;padding:12px;border-radius:14px;background:#0c3c88;color:white;background-image:linear-gradient(180deg,#062a68aa,#052b67ee),url('assets/nova-world-hero.jpg');background-size:cover;background-position:center}
.navpromo b{font-size:14px}
.navpromo p{font-size:10px;line-height:1.8}
.navpromo button{background:#fff;color:#075ddd;border:0;border-radius:9px;font-weight:900;padding:9px;width:100%}
.main{padding:15px;min-width:0}
.hero{min-height:282px;border:1px solid #cfe2fb;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;position:relative;padding:28px;display:flex;align-items:center;background:linear-gradient(90deg,rgba(224,241,255,.03) 0%,rgba(239,247,255,.1) 30%,rgba(255,255,255,.83) 61%,rgba(255,255,255,.97) 100%),url('assets/nova-world-hero.jpg') left center/cover no-repeat}
.hero-content{max-width:57%;margin-inline-start:auto;position:relative;z-index:1}
.eyebrow{display:inline-flex;color:var(--b);font-weight:900;font-size:11px;background:#e8f2ff;border:1px solid #d7e8ff;border-radius:30px;padding:5px 11px}
.hero h1{font-size:clamp(29px,3.4vw,47px);line-height:1.25;margin:10px 0;color:#0a2c65;font-weight:900}
.hero h1 span{color:var(--b)}
.hero p{color:#435d80;line-height:1.9;margin:0 0 15px;font-weight:600}
.hero .muted{font-size:12px;font-weight:500}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:800;font-size:11px}
.btn.blue{background:var(--b);color:#fff;box-shadow:0 5px 15px #0866f51f}
.btn.blue:hover{background:#0056d8}
.btn.soft{background:#eaf3ff;border-color:#d6e7ff;color:#075edc}
.btn.white{background:#fff;color:#075edc;border-color:#bdd7ff}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:19px;font-size:10px;color:#123d79;font-weight:800}
.hero-stats i{color:var(--b);margin-inline-end:5px}
.category-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:13px 0}
.category{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:start;box-shadow:0 3px 12px #163c6907;transition:.15s;padding:0;color:inherit;min-width:0}
.category:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.category img{width:100%;height:86px;object-fit:cover;display:block}
.catbottom{padding:0 10px 10px;position:relative}
.caticon{width:35px;height:35px;border-radius:50%;background:#fff;color:var(--b);display:grid;place-items:center;border:1px solid #d8e7fb;margin-top:-18px;position:relative;box-shadow:0 2px 10px #153d6b10}
.catbottom b{font-size:11px;display:block;margin-top:5px;color:#15345d}
.catbottom small{font-size:9px;line-height:1.6;color:var(--muted);display:block;margin-top:3px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 15px #133c6706;padding:14px;margin-bottom:13px;min-width:0}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panelhead h2{font-size:16px;margin:0;color:#173662}
.panelhead p{font-size:10px;color:var(--muted);margin:2px 0}
.textlink{border:0;background:transparent;color:var(--b);font-size:10px;font-weight:900;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:13px}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.product{border:1px solid #e3ebf5;border-radius:12px;overflow:hidden;min-width:0;background:#fff}
.product>img{width:100%;height:95px;object-fit:cover;display:block;background:#eef3fb}
.pbody{padding:8px}
.pbody h3{font-size:11px;margin:0 0 5px;line-height:1.6}
.meta{display:flex;align-items:center;gap:5px;color:#7687a0;font-size:9px;flex-wrap:wrap}
.price{font-weight:900;color:#df3f48;margin:7px 0 4px;font-size:12px}
.rowbtn{display:flex;gap:5px;margin-top:8px}
.rowbtn .btn{flex:1;padding:7px 3px;font-size:9px;white-space:nowrap}
.verified{display:inline-flex;background:#e8f9f1;color:#078359;padding:2px 6px;border-radius:20px;font-size:8px;font-weight:900}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.deal{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.deal img{height:80px;width:100%;object-fit:cover;display:block}
.dealbody{padding:8px}
.dealbody b{display:block;font-size:10px}
.dealbody p{font-size:9px;color:var(--muted);margin:4px 0}
.propertylayout{display:grid;grid-template-columns:.95fr 1.05fr;gap:9px}
.property{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.property img{width:100%;height:110px;object-fit:cover}
.property div{padding:9px}
.property h3{font-size:11px;margin:0 0 4px}
.greenprice{color:var(--green);font-weight:900;font-size:14px;margin:5px 0}
.map{height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#eaf1f8}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{padding:12px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(140deg,#fff,#f5f9ff)}
.metric small{font-size:9px;color:var(--muted)}
.metric b{display:block;font-size:19px;color:#087d5a}
.metric em{font-size:9px;color:#0a986a;font-style:normal}
.sectionpage{display:none}
.sectionpage.active{display:block}
.pagetitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:5px 0 14px}
.pagetitle .pi{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#e8f2ff;color:var(--b);font-size:23px}
.pagetitle h1{font-size:22px;margin:0;color:#133461}
.pagetitle p{font-size:11px;margin:3px 0;color:var(--muted)}
.pagetitle .right{margin-inline-start:auto}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid #dae5f2;border-radius:9px;padding:9px 10px;min-width:0;background:#fff;outline:0;color:#334c6d}
.filters input{flex:1;min-width:130px}
.filters select{min-width:125px}
.filters :focus,.field :focus{border-color:#86b5ff;box-shadow:0 0 0 3px #0866f510}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:5px;font-size:10px;font-weight:800;color:#4b6281}
.field.full{grid-column:1/-1}
.field textarea{min-height:76px;resize:vertical}
.notice{font-size:10px;color:var(--muted);line-height:1.8}
.empty{padding:23px;border:1px dashed #cbd9ed;border-radius:12px;text-align:center;color:#617895;background:#f9fbff}
.empty i{font-size:25px;color:#91add8}
.empty b{display:block;color:#23466f;margin:7px 0}
.tablewrap{overflow:auto}
.rfqtable{width:100%;border-collapse:collapse;font-size:10px}
.rfqtable th,.rfqtable td{text-align:start;padding:9px;border-bottom:1px solid #ecf1f7;white-space:nowrap}
.rfqtable th{background:#f7faff;color:#7a8ba4}
.transporttabs,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#f7faff;color:#486281;border:1px solid #dce7f4;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800}
.tab.active{background:var(--b);border-color:var(--b);color:#fff}
.trackform{display:flex;gap:8px}
.trackform input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px}
.timeline{display:flex;justify-content:space-between;position:relative;margin-top:18px}
.timeline:before{content:"";height:3px;position:absolute;top:6px;left:8%;right:8%;background:#dce7f6}
.step{z-index:1;text-align:center;font-size:9px;color:#71849e}
.dot{width:14px;height:14px;display:block;background:#dce7f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #c8d8ed;margin:0 auto 7px}
.step.done .dot{background:var(--b);box-shadow:0 0 0 1px var(--b)}
.modal{display:none;position:fixed;inset:0;background:#0b234b88;z-index:3000;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modalcard{width:min(640px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;padding:18px;box-shadow:0 25px 70px #071c3b44}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modalhead h2{font-size:17px;margin:0}
.x{border:0;border-radius:9px;background:#edf4ff;padding:7px 12px;color:#34587c}
.toast{position:fixed;bottom:18px;left:18px;z-index:4000;display:none;background:#163963;color:#fff;border-radius:11px;padding:12px 16px;max-width:90vw;box-shadow:var(--shadow)}
.toast.show{display:block}
.foot{text-align:center;padding:18px;color:#8694a9;font-size:9px}
.mobilemenu,.mobilenav{display:none}>×</button></div><p data-i="account.note">يلزم ربط تسجيل الدخول الآمن في الخادم لإدارة الحسابات والملفات التجارية.</p><button class="btn blue" onclick="closeModal('accountModal');go('listings')" data-i="listing.add">+ أضف عرضاً تجارياً</button></div></div>

</div>

</form>
</div>
</div>
