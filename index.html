<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA — AI Procurement</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f7f9fc;
      color: #172033;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 15px;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      padding: 13px 22px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .result {
      background: white;
      border: 1px solid #e1e6ef;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
    }

    .result h3 {
      margin-top: 0;
    }

    .result a {
      color: #2563eb;
      word-break: break-all;
    }

    .url {
      margin: 8px 0;
    }

    .snippet {
      color: #4b5563;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h1>NOVA</h1>
  <div class="subtitle">Your AI Purchasing Agent</div>

  <textarea id="procurementInput"
    placeholder="Example: I need 1000 stainless steel water bottles with my logo, delivered to Dubai"></textarea>

  <button id="searchButton" onclick="startSearch()">
    Search with Nova
  </button>

  <div id="status"></div>
  <div id="results"></div>

  <script>
    async function startSearch() {
      const input = document.getElementById("procurementInput");
      const button = document.getElementById("searchButton");
      const status = document.getElementById("status");
      const resultsBox = document.getElementById("results");

      const request = input.value.trim();

      if (!request) {
        status.textContent = "Please enter what you want to buy.";
        return;
      }

      button.disabled = true;
      status.textContent = "NOVA is searching real web results...";
      resultsBox.innerHTML = "";

      try {
        const response = await fetch("/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            request: request
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Search failed");
        }

        const results = data.results || [];

        if (results.length === 0) {
          status.textContent = "No results found.";
          return;
        }

        status.textContent =
          "NOVA found " + results.length + " web results.";

        resultsBox.innerHTML = results.map((item, index) => {
          const title = item.title || "Untitled result";
          const url = item.url || "#";
          const snippet =
            item.snippet ||
            item.description ||
            item.highlight ||
            "";

          return `
            <div class="result">
              <h3>${index + 1}. ${escapeHtml(title)}</h3>

              <div class="url">
                <a href="${escapeAttribute(url)}"
                   target="_blank"
                   rel="noopener noreferrer">
                  ${escapeHtml(url)}
                </a>
              </div>

              <div class="snippet">
                ${escapeHtml(snippet)}
              </div>
            </div>
          `;
        }).join("");

      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(text) {
      return String(text)
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>

</body>
</html>
