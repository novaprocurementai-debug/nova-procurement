function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function t(k,vars={}){let v=(LANGS[window.novaLang]&&LANGS[window.novaLang][k])||LANGS.en[k]||k;Object.keys(vars).forEach(x=>v=v.replaceAll("{"+x+"}",vars[x]));return v}
function countryName(code){try{return new Intl.DisplayNames([window.novaLang],{type:"region"}).of(code)||code}catch(e){return (COUNTRIES.find(x=>x[0]===code)||[])[1]||code}}
function renderCountries(){const opts='<option value="">'+t("allMarkets")+'</option>'+COUNTRIES.map(c=>'<option value="'+c[0]+'">'+esc(countryName(c[0]))+'</option>').join("");["homeCountry","countryExplorer","dest","rd"].forEach(id=>{if($(id))$(id).innerHTML=opts});if($("countryExplorer"))$("countryExplorer").onchange=function(){if(this.value){$("homeCountry").value=this.value;go("search");$("dest").value=this.value}}}
function applyLang(){document.documentElement.lang=window.novaLang;document.documentElement.dir=window.novaLang==="ar"?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));renderCountries();document.title="NOVA — "+t("hero1");$("lang").value=window.novaLang}

function toggleNav(){const n=$("nav");n.style.display=n.style.display==="flex"?"none":"flex"}

function resultCard(s){const raw=encodeURIComponent(JSON.stringify(s));return '<div class="result"><div class="result-top"><div class="avatar">🏭</div><div style="flex:1"><span class="badge">'+esc(s.country||"GLOBAL")+'</span><h3>'+esc(s.supplier||s.company||s.title||"Supplier")+'</h3><div class="muted">'+esc(s.title||s.product||"")+'</div></div></div><p class="muted">'+esc(s.snippet||s.description||"")+'</p><div class="metrics"><div class="metric"><small>'+t("price")+'</small><b>'+esc(s.price??"—")+'</b></div><div class="metric"><small>'+t("moq")+'</small><b>'+esc(s.moq??"—")+'</b></div><div class="metric"><small>'+t("lead")+'</small><b>'+esc(s.leadTime??"—")+'</b></div><div class="metric"><small>'+t("confidence")+'</small><b>'+esc(s.confidence??0)+'</b></div></div><div class="actions"><button class="primary" onclick="showSupplier(\''+raw+'\')">'+t("details")+'</button><button class="compare" onclick="useRFQ(\''+raw+'\')">'+t("rfqSend")+'</button></div></div>'}
function obj(x){try{return JSON.parse(decodeURIComponent(x))}catch(e){return{}}}

function useRFQ(x){const s=obj(x);$("rp").value=s.product||s.title||"";$("rr").value=t("supplier")+": "+(s.supplier||s.company||"")+"\n"+t("price")+": "+(s.price??"")+"\n"+t("moq")+": "+(s.moq??"");go("rfq")}
async function makeRFQ(){$("rfqStatus").textContent=t("creating");try{const d=await api("/api/rfq",{method:"POST",body:JSON.stringify({product:$("rp").value,quantity:$("rq").value,destination:$("rd").value,requirements:$("rr").value,incoterm:$("ri").value})});$("rfqo").textContent=d.rfq||d.result||d.message||JSON.stringify(d);$("rfqStatus").textContent=t("created")}catch(e){$("rfqStatus").textContent=e.message}}
async function calc(){const b={unitPrice:+$("lp").value||0,quantity:+$("lq").value||0,shipping:+$("ls").value||0,duty:+$("ld").value||0,tax:+$("lt").value||0,localDelivery:+$("ll").value||0};try{const d=await api("/api/landed-cost",{method:"POST",body:JSON.stringify(b)});$("lo").textContent=JSON.stringify(d.result||d,null,2)}catch(e){const g=b.unitPrice*b.quantity,du=g*b.duty/100,tx=(g+b.shipping+du)*b.tax/100;$("lo").textContent=t("total")+": $"+(g+b.shipping+du+tx+b.localDelivery).toFixed(2)}}
