
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b35">
<meta name="description" content="NOVA Global Procurement and Trade Intelligence">
<title>NOVA — المشتريات العالمية الذكية</title>
<style>
:root{--navy:#071a34;--navy2:#0d2b4d;--blue:#1265f5;--cyan:#36d7e8;--green:#07976e;--bg:#f1f5fa;--line:#e0e7ef;--text:#172b43;--muted:#718096;--shadow:0 5px 18px #0a254414}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;font-size:13px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6ec9ff;outline-offset:2px}
a{color:inherit}
.wrap{width:min(1700px,calc(100% - 24px));margin:auto}
header{background:#07182ff7;color:white;position:sticky;top:0;z-index:100;border-bottom:1px solid #ffffff1c;backdrop-filter:blur(12px)}
.head{display:flex;align-items:center;gap:16px;min-height:57px}
.brand{font-size:24px;font-weight:950;letter-spacing:1px;min-width:145px}
.brand small{display:block;font-size:8px;letter-spacing:.4px;color:#a9c2dd;font-weight:500}
.brand b{color:#47dbe7}
.nav{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
.nav button{border:0;background:transparent;color:#dce8f7;padding:10px 9px;border-radius:7px;white-space:nowrap;font-size:11px;font-weight:750}
.nav button:hover,.nav button.active{background:#1769ff;color:#fff}
.headtools{display:flex;align-items:center;gap:7px}
select,input,textarea{color:#172b43}
.lang{max-width:95px;background:#102a49;color:#fff;border:1px solid #35516e;padding:8px;border-radius:8px}
.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800}
.primary{background:linear-gradient(135deg,#1769ff,#0754d9);color:white;box-shadow:0 4px 12px #1769ff24}
.secondary{background:#eaf2ff;color:#1455bc;border:1px solid #d5e4ff}
.ghost{background:white;color:#29415b;border:1px solid #dbe4ed}
.mobile{display:none;background:#102a49;color:white;border:1px solid #35516e;border-radius:8px;padding:8px}
main{padding:10px 0 45px}
.page{display:none}.page.active{display:block}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:315px;border-radius:18px;color:white;padding:20px 24px;background:linear-gradient(90deg,#06152deF 0%,#062343d9 43%,#092b4d9c 100%),url("https://images.unsplash.com/photo-1494412519320-aa613dfb7738?auto=format&fit=crop&w=2200&q=85") center 52%/cover,#06182f;box-shadow:0 12px 35px #071b3530}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 54% 45%,#1caeff26,transparent 35%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.72fr);gap:20px;align-items:center;min-height:275px;position:relative}
.hero-copy{position:relative;z-index:2}
.eyebrow{display:inline-flex;gap:7px;align-items:center;border:1px solid #b4e8ff44;background:#04162caa;padding:6px 10px;border-radius:30px;font-size:11px;color:#dff9ff}
.dot{width:7px;height:7px;background:#38e6a3;border-radius:50%;box-shadow:0 0 0 4px #38e6a320}
h1{font-size:clamp(30px,3.3vw,49px);line-height:1.16;margin:12px 0;text-shadow:0 3px 18px #0004}
h1 span{color:#34d6da}
.hero-copy>p{font-size:13px;line-height:1.8;color:#d7e6f5;max-width:650px}
.globe{position:absolute;width:min(37%,420px);aspect-ratio:1;top:50%;left:38%;transform:translateY(-50%);opacity:.78;pointer-events:none;z-index:0;filter:drop-shadow(0 0 20px #38d5ff38)}
.globe svg{width:100%;height:100%}
.orbit{transform-origin:250px 250px;animation:orbit 38s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.searchbox{display:flex;align-items:center;gap:5px;background:white;border-radius:10px;padding:5px;margin-top:17px;box-shadow:0 6px 24px #0003;position:relative;z-index:3}
.searchbox input{flex:1;min-width:70px;border:0;outline:0;padding:11px;background:transparent}
.searchbox select{max-width:155px;min-width:110px;border:0;border-inline-start:1px solid #e0e7ef;background:white;padding:10px}
.searchbox button{font-size:19px;padding:8px 14px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;position:relative;z-index:2}
.quick button{background:#fffffff2;color:#233c55;border:1px solid #dfe8f0;border-radius:8px;padding:7px 10px;font-size:10px;font-weight:800}
.ai-panel{position:relative;z-index:3;padding:16px;border:1px solid #a4dfff48;background:#071b35d9;border-radius:15px;backdrop-filter:blur(10px);box-shadow:0 12px 28px #0003}
.ai-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;font-weight:900}
.online{font-size:10px;color:#5df0b5}
.ai-panel p{font-size:11px;color:#c7d9eb;line-height:1.8}
.ai-example{background:#fff;color:#43566b;border-radius:8px;padding:11px;line-height:1.8;font-size:11px;margin:10px 0}
.ai-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ai-actions button{border:1px solid #b8ddf32b;background:#123250;color:white;text-align:start;border-radius:8px;padding:9px 7px;font-size:10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:10px 0}
.stat{display:flex;gap:8px;align-items:center;min-width:0;padding:10px;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.stat-icon{width:31px;height:31px;flex-shrink:0;display:grid;place-items:center;background:#eaf4ff;color:#1769ff;border-radius:9px;font-size:17px}
.stat small{display:block;color:var(--muted);font-size:9px}
.stat strong{display:block;font-size:18px;margin:2px 0}
.stat em{display:block;font-style:normal;color:var(--muted);font-size:9px}
.section{margin-top:15px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.section-head h2{font-size:16px;margin:0}
.section-head p{font-size:10px;color:var(--muted);margin:4px 0 0}
.categories{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}
.cat{padding:0;overflow:hidden;border:1px solid var(--line);background:white;border-radius:9px;text-align:start;box-shadow:var(--shadow);font-size:10px;font-weight:800}
.cat-art{height:61px;display:grid;place-items:center;background:linear-gradient(145deg,#dcecff,#f2f8ff);font-size:27px}
.cat-label{display:block;padding:8px 7px}
.dashboard{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(210px,.83fr) minmax(210px,.83fr) minmax(190px,.7fr);gap:7px;align-items:stretch;margin-top:13px}
.panel{background:white;border:1px solid var(--line);border-radius:11px;min-width:0;overflow:hidden;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:10px;border-bottom:1px solid #edf1f6}
.panel-head h3{font-size:12px;margin:0}
.panel-body{padding:9px}
.supplier-row{display:grid;grid-template-columns:57px minmax(0,1fr);gap:9px;padding:9px 0;border-bottom:1px solid #edf1f6}
.supplier-row:last-child{border-bottom:0}
.supplier-art{display:grid;place-items:center;min-height:61px;background:linear-gradient(145deg,#e1efff,#f5f9ff);border-radius:7px;font-size:27px}
.supplier-name{font-weight:850;font-size:11px;overflow-wrap:anywhere}
.supplier-meta{color:var(--muted);font-size:9px;margin-top:4px;line-height:1.6}
.supplier-price{font-size:13px;font-weight:950;margin-top:6px}
.supplier-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.supplier-actions button{font-size:9px;padding:6px}
.pill{display:inline-block;padding:4px 6px;border-radius:20px;background:#e6f7ee;color:#08774f;font-size:9px;font-weight:800}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:8px}
.field label{font-size:10px;font-weight:800;color:#53667b}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #dce5ef;border-radius:7px;padding:8px;background:#fff;font-size:11px}
.field textarea{min-height:62px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.full{grid-column:1/-1}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}
.metric{padding:7px;border-radius:7px;background:#f4f7fb;min-width:0}
.metric small{display:block;color:var(--muted);font-size:9px}
.metric b{display:block;font-size:11px;margin-top:4px;overflow-wrap:anywhere}
.total-box{padding:11px;border-radius:8px;background:#e7f8ef;color:#08774e;margin:9px 0}
.total-box small{display:block;font-size:10px}.total-box strong{display:block;font-size:20px;margin:4px 0}
.result-list{max-height:570px;overflow:auto}
.status{font-size:11px;line-height:1.7;margin:7px 0;color:var(--muted);overflow-wrap:anywhere}
.status.error{color:#b4232a}.status.success{color:#08774e}
.empty{padding:17px;text-align:center;color:var(--muted);font-size:11px}
.source-link{color:#145bc8;font-size:10px;font-weight:800;display:inline-block;margin-top:5px}
.subdash{display:grid;grid-template-columns:1.15fr 1.15fr 1fr;gap:8px;margin-top:10px}
.market-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.market-card{overflow:hidden;border:1px solid var(--line);border-radius:9px;background:white}
.market-art{display:grid;place-items:center;min-height:55px;background:linear-gradient(140deg,#deecff,#f5f9ff);font-size:25px}
.market-card div:last-child{padding:7px;font-size:10px;font-weight:800}
.map-placeholder{position:relative;min-height:190px;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#d8f0f0,#c7e3e7 55%,#d6e6e8);border:1px solid #c6dce4}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(#fff8 1px,transparent 1px),linear-gradient(90deg,#fff8 1px,transparent 1px);background-size:25px 25px}
.map-label{position:absolute;top:10px;left:10px;background:#ffffffdb;border-radius:6px;padding:6px;font-size:10px}
.map-note{position:absolute;bottom:9px;right:9px;left:9px;background:#fffffff0;border-radius:7px;padding:9px;font-size:10px;line-height:1.6}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:10px;white-space:nowrap}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid #edf1f6}
th{color:#52657b;background:#f7f9fc}
.badge{display:inline-block;padding:4px 6px;border-radius:6px;background:#e8f8ef;color:#08764e}
.tools-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tool{display:flex;align-items:center;gap:9px;text-align:start;background:white;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:11px;font-weight:800}
.tool i{font-style:normal;font-size:20px}
.page-card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.health-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.health-item{background:#f5f8fc;border-radius:8px;padding:10px;font-size:11px}
.connected{color:#08764e}.disconnected{color:#b4232a}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #dce8f5;border-top-color:#1769ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{display:none;position:fixed;z-index:300;bottom:16px;right:16px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:9px;background:#102b49;color:white;box-shadow:0 10px 30px #0003}
.toast.show{display:block}.toast.error{background:#b4232a}.toast.success{background:#08764e}
footer{margin-top:25px;padding:17px 0;border-top:1px solid var(--line);color:var(--muted);font-size:10px}
@media(max-width:1350px){.nav{display:none}.nav.open{display:flex;position:absolute;top:57px;right:10px;left:10px;flex-direction:column;align-items:stretch;background:#07182f;padding:10px;border-radius:10px;box-shadow:0 12px 30px #0004}.mobile{display:block}.dashboard{grid-template-columns:repeat(3,minmax(0,1fr))}.dashboard .suppliers-panel{grid-column:span 2}.categories{grid-template-columns:repeat(5,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.hero{padding:16px}.hero-grid{grid-template-columns:1fr}.globe{width:75%;left:10%;opacity:.25}.ai-panel{max-width:none}.dashboard{grid-template-columns:1fr 1fr}.dashboard .suppliers-panel{grid-column:1/-1}.subdash{grid-template-columns:1fr 1fr}.subdash .wide{grid-column:1/-1}.market-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tools-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:540px){.wrap{width:calc(100% - 14px)}.head{gap:6px;min-height:53px}.brand{font-size:20px;min-width:auto}.brand small{font-size:7px}.headtools .primary{display:none}.lang{max-width:85px}.hero{padding:14px}.hero-grid{gap:12px}.hero h1{font-size:31px}.hero-copy>p{font-size:11px}.searchbox{flex-wrap:wrap}.searchbox input{flex-basis:55%}.searchbox select{max-width:none;flex:1}.stats{grid-template-columns:1fr 1fr}.stat{padding:7px}.stat strong{font-size:15px}.categories{grid-template-columns:repeat(3,minmax(0,1fr))}.dashboard{grid-template-columns:1fr}.dashboard .suppliers-panel{grid-column:auto}.subdash{grid-template-columns:1fr}.subdash .wide{grid-column:auto}.market-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tools-grid{grid-template-columns:1fr 1fr}.health-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.ai-actions{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
<div class="wrap head">
  <div class="brand">NOVA <b>✦</b><small>GLOBAL PROCUREMENT & TRADE INTELLIGENCE</small></div>
  <nav class="nav" id="nav">
    <button data-page="home" data-t="home"></button>
    <button data-page="search" data-t="suppliers"></button>
    <button data-page="rfq" data-t="rfq"></button>
    <button data-page="landed" data-t="landed"></button>
    <button data-page="negotiation" data-t="negotiation"></button>
    <button data-page="deals" data-t="deals"></button>
    <button data-page="tracking" data-t="tracking"></button>
    <button data-page="markets" data-t="markets"></button>
    <button data-page="account" data-t="account"></button>
  </nav>
  <div class="headtools">
    <select id="language" class="lang" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option></select>
    <button class="btn primary" onclick="go('search')" data-t="startBuying"></button>
    <button class="mobile" onclick="toggleNav()" aria-label="Menu">☰</button>
  </div>
</div>
</header>

<main class="wrap">
<section id="home" class="page active">
<div class="hero">
<div class="globe" aria-hidden="true">
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="gf" cx="35%" cy="28%" r="78%"><stop offset="0" stop-color="#a5f4ff" stop-opacity=".5"/><stop offset=".6" stop-color="#167ad8" stop-opacity=".18"/><stop offset="1" stop-color="#06152d" stop-opacity=".8"/></radialGradient><clipPath id="gc"><circle cx="250" cy="250" r="155"/></clipPath></defs>
<circle cx="250" cy="250" r="195" fill="none" stroke="#5ee6ff" stroke-opacity=".25"/>
<circle class="orbit" cx="250" cy="250" r="178" fill="none" stroke="#67eaff" stroke-opacity=".65" stroke-dasharray="3 9" stroke-width="2"/>
<circle cx="250" cy="250" r="155" fill="url(#gf)" stroke="#89e9ff" stroke-width="2"/>
<g clip-path="url(#gc)" fill="none" stroke="#8cecff" stroke-opacity=".5">
<ellipse cx="250" cy="250" rx="62" ry="155"/><ellipse cx="250" cy="250" rx="118" ry="155"/><ellipse cx="250" cy="250" rx="155" ry="53"/><ellipse cx="250" cy="250" rx="155" ry="104"/>
<path d="M95 250H405M100 195H400M100 305H400M250 95V405"/>
<path d="M118 145L180 166 203 207 184 242 208 270 191 310 220 354M266 102L287 145 320 163 328 199 363 222 345 254 367 289 342 325 306 344 291 386"/>
</g>
<g fill="none" stroke="#64dcff" stroke-width="1.5"><path d="M167 190Q250 110 326 204T300 316"/><path d="M167 190Q175 275 300 316"/><path d="M326 204Q230 250 211 335"/><ellipse cx="250" cy="250" rx="214" ry="73" transform="rotate(-28 250 250)"/><ellipse cx="250" cy="250" rx="214" ry="73" transform="rotate(46 250 250)" stroke-dasharray="4 8"/></g>
<g fill="#b9f6ff"><circle cx="167" cy="190" r="6"/><circle cx="326" cy="204" r="6"/><circle cx="300" cy="316" r="6"/><circle cx="211" cy="335" r="5"/></g>
</svg>
</div>
<div class="hero-grid">
<div class="hero-copy">
<div class="eyebrow"><span class="dot"></span><span data-t="eyebrow"></span></div>
<h1><span data-t="hero1"></span><span data-t="hero2"></span></h1>
<p data-t="heroText"></p>
<div class="searchbox">
<input id="homeQuery" data-p="searchPlaceholder">
<select id="homeCountry" aria-label="Destination"></select>
<button class="btn primary" onclick="homeSearch()" aria-label="Search">⌕</button>
</div>
<div class="quick">
<button onclick="quickSearch('wheat grain bulk suppliers')">🌾 <span data-t="agri"></span></button>
<button onclick="quickSearch('food products manufacturers')">🥬 <span data-t="food"></span></button>
<button onclick="quickSearch('industrial materials manufacturers')">🏭 <span data-t="industrial"></span></button>
<button onclick="quickSearch('agricultural machinery manufacturers')">🚜 <span data-t="machinery"></span></button>
<button onclick="quickSearch('vehicle manufacturers exporters')">🚗 <span data-t="vehicles"></span></button>
</div>
</div>
<aside class="ai-panel">
<div class="ai-title">✦ NOVA AI <span class="online">● <span data-t="online"></span></span></div>
<p data-t="aiText"></p>
<div class="ai-example" data-t="aiExample"></div>
<div class="ai-actions">
<button onclick="go('search')">🔎 <span data-t="find"></span></button>
<button onclick="go('landed')">🧮 <span data-t="landed"></span></button>
<button onclick="go('rfq')">📄 <span data-t="rfq"></span></button>
<button onclick="go('negotiation')">🤝 <span data-t="negotiation"></span></button>
<button onclick="go('tracking')">🚢 <span data-t="tracking"></span></button>
<button onclick="go('markets')">🌐 <span data-t="markets"></span></button>
</div>
</aside>
</div>
</div>

<div class="stats">
<div class="stat"><span class="stat-icon">♙</span><div><small data-t="records"></small><strong id="networkRecords">—</strong><em data-t="databaseRecords"></em></div></div>
<div class="stat"><span class="stat-icon">◎</span><div><small data-t="countries"></small><strong>195+</strong><em data-t="marketsWorldwide"></em></div></div>
<div class="stat"><span class="stat-icon">◉</span><div><small data-t="systemStatus"></small><strong id="onlineState">—</strong><em id="healthSmall">—</em></div></div>
<div class="stat"><span class="stat-icon">✧</span><div><small>NOVA AI</small><strong id="aiState">—</strong><em data-t="aiStatus"></em></div></div>
<div class="stat"><span class="stat-icon">🛡</span><div><small data-t="evidence"></small><strong>✓</strong><em data-t="evidenceSub"></em></div></div>
<div class="stat"><span class="stat-icon">🌍</span><div><small data-t="coverage"></small><strong>Global</strong><em data-t="coverageSub"></em></div></div>
</div>

<div class="section">
<div class="section-head"><div><h2 data-t="sectors"></h2><p data-t="sectorsSub"></p></div></div>
<div class="categories" id="categories"></div>
</div>

<div class="dashboard">
<section class="panel suppliers-panel">
<div class="panel-head"><h3>🔎 <span data-t="supplierResults"></span></h3><button class="btn secondary" onclick="go('search')" data-t="allResults"></button></div>
<div class="panel-body">
<div class="field"><input id="dashQuery" data-p="searchPlaceholder"></div>
<div class="actions"><button class="btn primary" onclick="dashboardSearch()" data-t="search"></button><select id="dashCountry" aria-label="Destination"></select></div>
<div id="dashResults" class="result-list"><div class="empty" data-t="searchPrompt"></div></div>
</div>
</section>

<section class="panel">
<div class="panel-head"><h3>🏢 <span data-t="supplierDetails"></span></h3><span class="pill" data-t="evidenceFirst"></span></div>
<div class="panel-body" id="supplierDetails"><div class="empty" data-t="selectSupplier"></div></div>
</section>

<section class="panel">
<div class="panel-head"><h3>🧮 <span data-t="landedCalc"></span></h3></div>
<div class="panel-body">
<div class="form-grid">
<div class="field"><label data-t="unitPrice"></label><input id="unitPrice" type="number" min="0" value="245"></div>
<div class="field"><label data-t="quantity"></label><input id="landedQuantity" type="number" min="1" value="500"></div>
<div class="field"><label data-t="shipping"></label><input id="shipping" type="number" min="0" value="35"></div>
<div class="field"><label data-t="insurance"></label><input id="insurance" type="number" min="0" value="2"></div>

const MARKET=[["🌾","agri","wheat bulk suppliers"],["🥬","food","food manufacturers"],["🏭","industrial","industrial suppliers"],["🚜","machinery","machinery exporters"],["🚗","vehicles","vehicle exporters"],["⚙️","industrial","industrial equipment"],["🏘️","markets","commercial property"],["🚢","tracking","freight forwarders"],["💻","markets","electronics OEM"],["✈️","tracking","air freight"]];
function renderMarkets(){
const html=MARKET.map(([ico,k,q])=>`<button class="market-card" data-query="${esc(q)}"><div class="market-art">${ico}</div><div>${esc(t(k))}</div></button>`).join("");
["marketCards","marketCardsPage"].forEach(id=>{const e=$(id);if(e){e.innerHTML=html;e.querySelectorAll("[data-query]").forEach(b=>b.onclick=()=>quickSearch(b.dataset.query));}});
}
function applyLang(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
$("language").value=lang;fillCountries();renderCats();renderMarkets();
}
$("language").addEventListener("change",e=>{lang=e.target.value==="en"?"en":"ar";try{localStorage.setItem("nova_lang",lang);}catch{}applyLang();});
try{const l=localStorage.getItem("nova_lang");if(l==="ar"||l==="en")lang=l;}catch{}

async function api(path,options={}){
let r;
try{r=await fetch(path,{...options,credentials:"same-origin",headers:{"Accept":"application/json",...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})}});}
catch{throw new Error(t("networkError"));}
const raw=await r.text();let d={};
try{d=raw?JSON.parse(raw):{};}catch{throw new Error(r.ok?"Invalid JSON response":`HTTP ${r.status}`);}
if(!r.ok||d.error)throw new Error(d.error||`HTTP ${r.status}`);
return d;
}
function go(id){
document.querySelectorAll(".page").forEach(e=>e.classList.toggle("active",e.id===id));
document.querySelectorAll("[data-page]").forEach(e=>e.classList.toggle("active",e.dataset.page===id));
$("nav").classList.remove("open");window.scrollTo({top:0,behavior:"smooth"});
if(id==="deals")loadDeals();if(id==="account")checkAccount();
}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
function toggleNav(){$("nav").classList.toggle("open");}
function homeSearch(){$("dashQuery").value=$("homeQuery").value;go("home");runSearch($("dashQuery").value,$("homeCountry").value,"dashResults");}
function quickSearch(q){$("homeQuery").value=q;$("dashQuery").value=q;$("query").value=q;go("home");runSearch(q,$("homeCountry").value,"dashResults");}
function dashboardSearch(){runSearch($("dashQuery").value,$("dashCountry").value,"dashResults");}
function extractResults(d){if(Array.isArray(d))return d;for(const k of ["results","suppliers","items","organic","data"])if(Array.isArray(d?.[k]))return d[k];return [];}
function priceText(s){const p=s.price??s.unit_price;if(p===null||p===undefined||p==="")return t("unknown");return typeof p==="number"?money(p,s.currency||"USD"):String(p);}
function card(s,i){
const name=s.title||s.name||s.company||s.supplier||t("unknown");
const url=s.url||s.link||"";
const snippet=s.snippet||s.description||"";
const country=s.country||s.region||"";
return `<article class="supplier-row"><div class="supplier-art">${["🌾","🏭","🚜","🚢","⚙️"][i%5]}</div><div><div class="supplier-name">${esc(name)}</div><div class="supplier-meta">${esc(country)} ${s.verification?("· "+esc(s.verification)):""}</div><div class="supplier-price">${esc(priceText(s))}</div><div class="supplier-meta">MOQ: ${esc(fmt(s.moq))} · ${esc(s.leadTime||t("unknown"))}</div><div class="supplier-actions"><button class="btn primary" data-detail="${i}">${esc(t("details"))}</button><button class="btn secondary" data-rfq="${i}">${esc(t("rfq"))}</button><button class="btn ghost" data-neg="${i}">🤝</button></div>${url&&/^https?:\/\//i.test(url)?`<a class="source-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(t("source"))}</a>`:`<div class="supplier-meta">${esc(t("noSource"))}</div>`}</div></article>`;
}
function renderResults(results,target){
const el=$(target);
if(!results.length){el.innerHTML=`<div class="empty">${esc(t("noResults"))}</div>`;return;}
el.innerHTML=results.map(card).join("");
el.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>showSupplier(results[Number(b.dataset.detail)]));
el.querySelectorAll("[data-rfq]").forEach(b=>b.onclick=()=>prefillRFQ(results[Number(b.dataset.rfq)]));
el.querySelectorAll("[data-neg]").forEach(b=>b.onclick=()=>prefillNeg(results[Number(b.dataset.neg)]));
}
async function runSearch(query,destination,target){
query=String(query||"").trim();
if(!query){toast(t("searchPrompt"),"error");return;}
const el=$(target);el.innerHTML=`<div class="empty"><span class="loading"></span> ${esc(t("searching"))}</div>`;
try{
/* The existing Worker accepts "request". Add destination to the query text so the search provider receives the intended market. */
const fullQuery=destination?`${query} supplier in ${countryName(destination)} ${destination}`:query;
const d=await api("/api/search",{method:"POST",body:JSON.stringify({request:fullQuery})});
lastSuppliers=extractResults(d);renderResults(lastSuppliers,target);
if(target==="dashResults"&&lastSuppliers.length)showSupplier(lastSuppliers[0]);
if(target==="results")setStatus("searchStatus",`${lastSuppliers.length} · ${t("supplierResults")}`,"success");
}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`;if(target==="results")setStatus("searchStatus",e.message,"error");}
}
function searchSuppliers(){runSearch($("query").value,$("destination").value,"results");}
function clearSearch(){$("query").value="";$("results").innerHTML="";setStatus("searchStatus","");}
function showSupplier(s){
const name=s.title||s.name||s.company||s.supplier||t("unknown");
const url=s.url||s.link||"";
$("supplierDetails").innerHTML=`<div class="supplier-art" style="font-size:35px">🏢</div><h3>${esc(name)}</h3><span class="pill">${esc(s.verification||t("evidenceFirst"))}</span><p class="status">${esc(s.snippet||s.description||t("noDescription"))}</p><div class="metrics"><div class="metric"><small>${esc(t("country"))}</small><b>${esc(s.country||s.region||t("unknown"))}</b></div><div class="metric"><small>${esc(t("price"))}</small><b>${esc(priceText(s))}</b></div><div class="metric"><small>${esc(t("moq"))}</small><b>${esc(fmt(s.moq))}</b></div><div class="metric"><small>${esc(t("status"))}</small><b>${esc(s.confidence??t("unknown"))}</b></div></div>${url&&/^https?:\/\//i.test(url)?`<a class="source-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(t("source"))}</a>`:""}<div class="actions"><button class="btn primary" id="detailRFQ">${esc(t("rfq"))}</button><button class="btn secondary" id="detailNeg">🤝 ${esc(t("negotiation"))}</button></div>`;
$("detailRFQ").onclick=()=>prefillRFQ(s);$("detailNeg").onclick=()=>prefillNeg(s);
}
function prefillRFQ(s){
const name=s.title||s.name||s.company||s.supplier||"";
const product=$("dashQuery").value||$("query").value||name;
$("rfqProduct").value=product;$("rfqProduct2").value=product;
$("rfqQuantity").value=$("quantity").value||500;$("rfqQuantity2").value=$("quantity").value||500;
go("rfq");
}
function prefillNeg(s){
$("negSupplier").value=s.title||s.name||s.company||s.supplier||"";
$("negOffer").value=Number(s.price)||"";
$("negTarget").value="";$("negQuantity").value=$("quantity").value||500;
go("negotiation");
}
async function createRFQ(){
const product=$("rfqProduct").value.trim(),quantity=Number($("rfqQuantity").value);
if(!product||quantity<1){toast(t("invalid"),"error");return;}
$("rfqOutput").textContent=t("loading");
try{
const d=await api("/api/rfq",{method:"POST",body:JSON.stringify({product,quantity,destination:$("rfqDestination").value,incoterm:$("rfqIncoterm").value,requirements:$("rfqRequirements").value})});
const text=d.result||d.rfq||d.text||d.message||d.id||JSON.stringify(d);
$("rfqOutput").textContent=typeof text==="string"?text:JSON.stringify(text,null,2);
toast(t("rfqSuccess"),"success");
}catch(e){$("rfqOutput").textContent=e.message;}
}
function createRFQFromPage(){
$("rfqProduct").value=$("rfqProduct2").value;$("rfqQuantity").value=$("rfqQuantity2").value;
$("rfqDestination").value=$("rfqDestination2").value;$("rfqIncoterm").value=$("rfqIncoterm2").value;
$("rfqRequirements").value=$("rfqRequirements2").value;createRFQ();
}
async function calculateLanded(){
const b={unitPrice:Number($("unitPrice").value),quantity:Number($("landedQuantity").value),shipping:Number($("shipping").value)||0,insurance:Number($("insurance").value)||0,dutyPercent:Number($("duty").value)||0,taxPercent:Number($("tax").value)||0,localDelivery:Number($("localDelivery").value)||0};
if(!Number.isFinite(b.unitPrice)||b.unitPrice<0||b.quantity<1){toast(t("invalid"),"error");return;}
["landedOutput","landedPageOutput"].forEach(id=>{if($(id))$(id).textContent=t("loading");});
try{
const d=await api("/api/landed-cost",{method:"POST",body:JSON.stringify(b)});
const v=d.result||d;
const fields=[["goods",v.goods],["shipping",v.shipping],["insurance",v.insurance],["duty",v.duty],["tax",v.tax],["localDelivery",v.localDelivery],["landedTotal",v.total],["unitLanded",v.unitLanded]];
const html=`<div class="total-box"><small>${esc(t("landedTotal"))}</small><strong>${esc(money(v.total))}</strong><small>${esc(t("unitLanded"))}: ${esc(money(v.unitLanded))}</small></div><div class="metrics">${fields.filter(x=>x[1]!==undefined&&x[1]!==null).map(([k,n])=>`<div class="metric"><small>${esc(t(k)||k)}</small><b>${esc(money(n))}</b></div>`).join("")}</div><p class="status">${esc(t("landedStatus"))}</p>`;
["landedOutput","landedPageOutput"].forEach(id=>{if($(id))$(id).innerHTML=html;});
}catch(e){["landedOutput","landedPageOutput"].forEach(id=>{if($(id))$(id).textContent=e.message;});}
}
async function negotiate(){
const supplier=$("negSupplier").value.trim(),offer=Number($("negOffer").value);
if(!supplier||!Number.isFinite(offer)||offer<=0){toast(t("invalid"),"error");return;}
["negOutput","negPageOutput"].forEach(id=>{if($(id))$(id).textContent=t("loading");});
try{
const d=await api("/api/negotiate",{method:"POST",body:JSON.stringify({supplier,offer,target:Number($("negTarget").value)||0,quantity:Number($("negQuantity").value)||1,reply:$("negReply").value.trim()})});
const r=d.result??d;
const text=typeof r==="string"?r:JSON.stringify(r,null,2);
["negOutput","negPageOutput"].forEach(id=>{if($(id))$(id).textContent=text;});
}catch(e){["negOutput","negPageOutput"].forEach(id=>{if($(id))$(id).textContent=e.message;});}
}
async function loadDeals(){
$("dealsOutput").textContent=t("loading");
try{
const d=await api("/api/deals");const rows=Array.isArray(d.deals)?d.deals:[];
if(!rows.length){$("dealsOutput").textContent=t("noDeals");return;}
$("dealsOutput").innerHTML=rows.map(x=>`<article class="supplier-row"><div class="supplier-art">🔥</div><div><strong>${esc(x.product||t("unknown"))}</strong><p>${esc(x.company||"")} · ${esc(x.country||"")}</p><strong>${esc(x.price!=null?money(x.price,x.currency||"USD"):t("unknown"))}</strong><p>${esc(x.description||"")}</p>${x.url&&/^https?:\/\//i.test(x.url)?`<a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(t("source"))}</a>`:""}</div></article>`).join("");
}catch(e){$("dealsOutput").textContent=e.message;}
}
async function login(){
const email=$("email").value.trim(),password=$("password").value;
if(!email||!password){toast(t("invalid"),"error");return;}
try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({email,password})});$("accountOutput").textContent=`${t("success")}: ${d.email||email}`;toast(t("success"),"success");}
catch(e){$("accountOutput").textContent=e.message;}
}
async function signup(){
const email=$("email").value.trim(),password=$("password").value;
if(!email||password.length<6){toast(t("invalid"),"error");return;}
try{const d=await api("/api/signup",{method:"POST",body:JSON.stringify({email,password})});$("accountOutput").textContent=`${t("success")}: ${d.email||email}`;toast(t("success"),"success");}
catch(e){$("accountOutput").textContent=e.message;}
}
async function logout(){
try{await api("/api/logout",{method:"POST"});$("accountOutput").textContent=t("loggedOut");}
catch(e){$("accountOutput").textContent=e.message;}
}
async function checkAccount(){
try{const d=await api("/api/me");$("accountOutput").textContent=d.loggedIn?`${t("connected")}: ${d.user?.email||""}`:t("loginFirst");}
catch(e){$("accountOutput").textContent=e.message;}
}
function health(id,yes){$(id).textContent=yes?t("connected"):t("notConnected");$(id).className=yes?"connected":"disconnected";}
async function checkHealth(){
try{
const d=await api("/api/health");
health("healthNova",!!d.ok);health("healthDB",!!d.database);health("healthAI",!!d.ai);health("healthSearch",!!d.yep);
$("onlineState").textContent=d.ok?t("connected"):t("offline");$("aiState").textContent=d.ai?t("connected"):t("offline");
$("healthSmall").textContent=d.database?t("connected"):t("notConnected");
}catch{
["healthNova","healthDB","healthAI","healthSearch"].forEach(id=>health(id,false));
$("onlineState").textContent=t("offline");$("aiState").textContent=t("offline");$("healthSmall").textContent=t("notConnected");
}
}
async function loadNetwork(){
try{const d=await api("/api/network");$("networkRecords").textContent=fmt(d.actualRecords||0);}
catch{$("networkRecords").textContent="—";}
}
async function trackShipment(){
const number=$("trackingNumber").value.trim();
if(!number){$("trackOutput").textContent=t("invalid");return;}
/* The current Worker has no tracking API route. Do not display fabricated carrier data. */
$("trackOutput").textContent=t("trackingUnavailable");
$("trackingStatus").textContent=t("trackingProviderNote");
}
function searchSelectedMarket(){
const code=$("countryExplorer").value;
$("homeCountry").value=code;$("dashCountry").value=code;
$("dashQuery").value="manufacturers suppliers exporters";
go("home");dashboardSearch();
}
async function init(){
applyLang();
await Promise.allSettled([checkHealth(),loadNetwork()]);
}
init();
</script>
