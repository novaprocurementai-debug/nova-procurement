<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="description" content="NOVA Global AI Procurement Platform">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/nova-icon.svg">
<link rel="apple-touch-icon" href="/nova-icon-192.png">

<title>NOVA — Global AI Procurement</title>

<style>
:root{
  --navy:#071426;
  --navy2:#0b1d35;
  --blue:#1769ff;
  --blue2:#6757f5;
  --cyan:#79e8ff;
  --bg:#f4f7fb;
  --card:#fff;
  --line:#e3e9f1;
  --text:#102033;
  --muted:#68778a;
  --green:#08764e;
  --greenbg:#eaf8f2;
  --red:#b4232a;
  --redbg:#fff0f0;
  --orange:#a15c00;
  --shadow:0 12px 34px rgba(8,27,50,.08);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,"Noto Sans",sans-serif;
}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

.wrap{
  width:min(1240px,calc(100% - 30px));
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,20,38,.98);
  color:#fff;
  box-shadow:0 2px 18px rgba(0,0,0,.12);
}

.head{
  min-height:70px;
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:28px;
  font-weight:950;
  letter-spacing:1px;
  white-space:nowrap;
}

.logo-mark{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#fff;
  font-size:19px;
}

.nav{
  display:flex;
  flex:1;
  justify-content:center;
  gap:3px;
}

.nav button{
  border:0;
  background:transparent;
  color:#c9d5e4;
  padding:10px 11px;
  border-radius:9px;
  font-weight:750;
  white-space:nowrap;
}

.nav button:hover,
.nav button.active{
  color:#fff;
  background:#15304f;
}

.tools{
  display:flex;
  gap:7px;
  align-items:center;
}

.lang{
  max-width:135px;
  padding:9px 8px;
  border-radius:8px;
  border:1px solid #2d4562;
  background:#10233c;
  color:#fff;
}

.primary,.outline,.dark,.danger{
  border-radius:10px;
  padding:10px 15px;
  font-weight:850;
}

.primary{
  border:0;
  background:linear-gradient(90deg,var(--blue),var(--blue2));
  color:#fff;
}

.primary:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.outline{
  border:1px solid #d7e0eb;
  background:#fff;
  color:#17324f;
}

.dark{
  border:0;
  background:#102033;
  color:#fff;
}

.danger{
  border:1px solid #f1b9b9;
  background:#fff3f3;
  color:var(--red);
}

.mobile{
  display:none;
  background:#10233c;
  color:#fff;
  border:1px solid #2d4562;
  border-radius:8px;
  padding:9px 11px;
}

main{padding:22px 0 70px}

.page{display:none}
.page.active{display:block}

.hero{
  border-radius:25px;
  padding:46px;
  color:#fff;
  background:
    radial-gradient(circle at 78% 20%,rgba(49,209,255,.25),transparent 31%),
    linear-gradient(120deg,#061221,#0b3157 60%,#07618e);
  box-shadow:0 18px 50px rgba(5,32,61,.16);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:30px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  font-size:12px;
  font-weight:900;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#46e6a4;
  box-shadow:0 0 0 5px rgba(70,230,164,.12);
}

.hero h1{
  font-size:51px;
  line-height:1.06;
  margin:18px 0 12px;
}

.hero h1 span:last-child{color:var(--cyan)}

.hero p{
  color:#dbeafe;
  line-height:1.8;
  font-size:17px;
}

.searchbox{
  display:flex;
  background:#fff;
  padding:6px;
  border-radius:14px;
  margin-top:23px;
  box-shadow:0 8px 28px rgba(0,0,0,.13);
}

.searchbox input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:12px;
}

.searchbox select{
  width:190px;
  border:0;
  border-inline-start:1px solid #e1e7ef;
  padding:0 10px;
  outline:0;
  background:#fff;
}

.searchbox button{
  width:52px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:22px;
}

.quick{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px;
}

.quick button{
  border:0;
  border-radius:999px;
  padding:8px 11px;
  background:#fff;
  color:#19334f;
  font-size:12px;
  font-weight:800;
}

.ai{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:19px;
  padding:21px;
  backdrop-filter:blur(10px);
}

.ai h3{margin-top:0}

.ai-box{
  background:#fff;
  color:#24354a;
  border-radius:11px;
  padding:14px;
  margin:14px 0;
  line-height:1.6;
}

.ai button{
  width:100%;
  margin-top:7px;
  background:#fff;
  color:#17334f;
  border:0;
  border-radius:9px;
  padding:10px;
  font-weight:800;
  text-align:start;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
  margin:17px 0;
}

.stat,.card,.countrybox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  box-shadow:var(--shadow);
}

.stat{padding:17px}

.stat b{
  display:block;
  margin:4px 0;
  font-size:27px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.section{margin-top:25px}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  font-size:22px;
}

.section-head p{
  margin:4px 0;
  color:var(--muted);
  font-size:13px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:9px;
}

.cat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 8px;
  text-align:center;
  font-weight:800;
  color:#18314d;
}

.cat:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.cat i{
  display:block;
  font-style:normal;
  font-size:27px;
  margin-bottom:6px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
}

.product{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
}

.pic{
  height:100px;
  display:grid;
  place-items:center;
  font-size:52px;
  background:linear-gradient(135deg,#eef6ff,#d9ebff);
}

.product-body{padding:13px}

.product h3{
  margin:0 0 4px;
  font-size:15px;
}

.tools-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
}

.tool{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  text-align:center;
  color:#18314d;
}

.tool i{
  display:block;
  font-style:normal;
  font-size:25px;
}

.tool b{
  display:block;
  margin-top:6px;
  font-size:13px;
}

.coverage{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:15px;
  margin-top:18px;
}

.coverage-card{
  padding:21px;
  background:linear-gradient(135deg,#0b1d35,#0b5b8c);
  color:#fff;
  border-radius:18px;
}

.coverage-card h2{margin-top:0}

.coverage-card p{
  color:#dbeafe;
  line-height:1.7;
}

.country-count{
  font-size:31px;
  font-weight:950;
  color:#7ee8ff;
}

.countrybox{padding:18px}

.countrybox select{
  width:100%;
  padding:12px;
  border:1px solid #d5deea;
  border-radius:10px;
  background:#fff;
}

.card{padding:21px}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{grid-column:1/-1}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:850;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #d5deea;
  border-radius:10px;
  outline:0;
  background:#fff;
  color:#102033;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#7daaff;
  box-shadow:0 0 0 3px rgba(23,105,255,.08);
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.two{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:17px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px;
}

.status{
  padding:10px 2px;
  min-height:20px;
}

.result{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  margin:10px 0;
  box-shadow:var(--shadow);
}

.result-top{
  display:flex;
  gap:12px;
  align-items:center;
}

.avatar{
  width:66px;
  height:66px;
  flex:0 0 66px;
  border-radius:12px;
  background:#e7f1ff;
  display:grid;
  place-items:center;
  font-size:30px;
}

.result h3{
  margin:5px 0;
  overflow-wrap:anywhere;
}

.badge{
  display:inline-block;
  background:var(--greenbg);
  color:var(--green);
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  font-weight:900;
}

.badge.warn{
  background:#fff6e8;
  color:var(--orange);
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:12px;
}

.metric{
  background:#f6f8fb;
  border-radius:9px;
  padding:9px;
}

.metric small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

.metric b{
  overflow-wrap:anywhere;
}

.source-link{
  display:inline-block;
  margin-top:9px;
  color:#175bc6;
  font-weight:800;
  text-decoration:none;
}

.source-link:hover{text-decoration:underline}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.copy{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.75;
  background:#f7f9fc;
  border-radius:11px;
  padding:14px;
}

.ok{color:var(--green)}
.err{color:var(--red)}

.notice{
  border:1px solid #dbe6f4;
  background:#f7fbff;
  border-radius:12px;
  padding:12px;
  line-height:1.6;
}

.health-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.health-item{
  padding:13px;
  border-radius:12px;
  background:#f6f8fb;
}

.health-item b{display:block;margin-top:5px}

.connected{color:var(--green)}
.disconnected{color:var(--red)}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(3,14,27,.68);
}

.modal.show{display:flex}

.modal-card{
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border-radius:19px;
  background:#fff;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.close{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:#eef2f6;
}

.toast{
  display:none;
  position:fixed;
  bottom:18px;
  inset-inline-start:18px;
  z-index:300;
  max-width:min(420px,calc(100% - 36px));
  padding:12px 16px;
  border-radius:10px;
  background:#102033;
  color:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.toast.show{display:block}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

.loader{
  display:inline-block;
  width:15px;
  height:15px;
  margin-inline-end:7px;
  vertical-align:-2px;
  border:2px solid #d8e2ee;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:1050px){
  .nav{display:none}
  .nav.open{
    display:flex;
    position:absolute;
    top:70px;
    inset-inline:15px;
    flex-direction:column;
    padding:10px;
    background:#0b1d35;
    border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .mobile{display:block}
  .hero-grid,.two,.coverage{grid-template-columns:1fr}
  .categories{grid-template-columns:repeat(4,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .tools-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:680px){
  .wrap{width:min(100% - 20px,1240px)}
  .head{min-height:64px}
  .logo{font-size:23px}
  .logo-mark{width:31px;height:31px}
  .tools .primary{display:none}
  .lang{max-width:110px}
  .hero{padding:27px 19px}
  .hero h1{font-size:35px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .categories{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .tools-grid{grid-template-columns:1fr 1fr}
  .health-grid{grid-template-columns:1fr 1fr}
  .searchbox{flex-wrap:wrap}
  .searchbox select{
    width:100%;
    border-inline-start:0;
    border-top:1px solid #e1e7ef;
    padding:9px;
  }
}

@media(max-width:430px){
  .cards{grid-template-columns:1fr}
  .hero h1{font-size:31px}
}
</style>
</head>

<body>

<header>
<div class="wrap head">

  <div class="logo">
    <span class="logo-mark">N</span>
    NOVA
  </div>

  <nav class="nav" id="nav">
    <button data-page="home" data-i18n="home"></button>
    <button data-page="search" data-i18n="suppliers"></button>
    <button data-page="rfq" data-i18n="rfq"></button>
    <button data-page="landed" data-i18n="landed"></button>
    <button data-page="negotiation" data-i18n="negotiation"></button>
    <button data-page="deals" data-i18n="deals"></button>
    <button data-page="history" data-i18n="purchases"></button>
    <button data-page="account" data-i18n="account"></button>
  </nav>

  <div class="tools">
    <select id="language" class="lang" aria-label="Language"></select>

    <button class="primary" data-i18n="startBuying"
      onclick="go('search')"></button>

    <button class="mobile"
      aria-label="Menu"
      onclick="toggleNav()">☰</button>
  </div>

</div>
</header>

<main class="wrap">

<!-- HOME -->
<section id="home" class="page active">

  <div class="hero">
    <div class="hero-grid">

      <div>
        <div class="eyebrow">
          <span class="live-dot"></span>
          <span data-i18n="verifiedFirst"></span>
        </div>

        <h1>
          <span data-i18n="globalProcurement"></span><br>
          <span data-i18n="poweredAI"></span>
        </h1>

        <p data-i18n="heroText"></p>

        <div class="searchbox">
          <input id="homeQuery"
            data-placeholder="searchPlaceholder">

          <select id="homeCountry"></select>

          <button onclick="homeSearch()"
            aria-label="Search">⌕</button>
        </div>

        <div class="quick">
          <button onclick="quickSearch('wheat bulk suppliers')">
            🌾 <span data-i18n="wheat"></span>
          </button>

          <button onclick="quickSearch('fertilizer manufacturers')">
            🧪 <span data-i18n="fertilizers"></span>
          </button>

          <button onclick="quickSearch('agricultural machinery manufacturers')">
            🚜 <span data-i18n="machinery"></span>
          </button>

          <button onclick="quickSearch('solar panel manufacturers')">
            ☀️ <span data-i18n="energy"></span>
          </button>

          <button onclick="quickSearch('vehicle manufacturers exporters')">
            🚗 <span data-i18n="vehicles"></span>
          </button>
        </div>
      </div>

      <div class="ai">
        <h3>✦ NOVA AI</h3>

        <p data-i18n="aiAssistant"></p>

        <div class="ai-box"
          data-i18n="aiExample"></div>

        <button onclick="go('search')">
          🔎 <span data-i18n="findSuppliers"></span>
        </button>

        <button onclick="go('rfq')">
          📄 <span data-i18n="createRFQ"></span>
        </button>

        <button onclick="go('negotiation')">
          🤝 <span data-i18n="startNegotiation"></span>
        </button>
      </div>

    </div>
  </div>

  <div class="stats">

    <div class="stat">
      <small data-i18n="actualRecords"></small>
      <b id="networkRecords">—</b>
      <span class="muted" data-i18n="databaseRecords"></span>
    </div>

    <div class="stat">
      <small data-i18n="globalMarkets"></small>
      <b>195+</b>
      <span class="muted" data-i18n="countriesMarkets"></span>
    </div>

    <div class="stat">
      <small data-i18n="systemStatus"></small>
      <b id="onlineState">—</b>
      <span class="muted" id="healthSmall">—</span>
    </div>

    <div class="stat">
      <small>NOVA AI</small>
      <b id="aiState">—</b>
      <span class="muted" data-i18n="negotiationAnalysis"></span>
    </div>

  </div>

  <div class="section">
    <div class="section-head">
      <div>
        <h2 data-i18n="sectors"></h2>
        <p data-i18n="chooseSector"></p>
      </div>
    </div>

    <div class="categories" id="categories"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div>
        <h2 data-i18n="globalOpportunities"></h2>
      </div>

      <button class="outline"
        onclick="go('search')"
        data-i18n="explore"></button>
    </div>

    <div class="cards">

      <div class="product">
        <div class="pic">🚜</div>
        <div class="product-body">
          <h3 data-i18n="agriculture"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

      <div class="product">
        <div class="pic">🌾</div>
        <div class="product-body">
          <h3 data-i18n="crops"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

      <div class="product">
        <div class="pic">🧪</div>
        <div class="product-body">
          <h3 data-i18n="fertilizers"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

      <div class="product">
        <div class="pic">💻</div>
        <div class="product-body">
          <h3 data-i18n="electronics"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

      <div class="product">
        <div class="pic">✈️</div>
        <div class="product-body">
          <h3 data-i18n="aviation"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

      <div class="product">
        <div class="pic">🚢</div>
        <div class="product-body">
          <h3 data-i18n="marine"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

      <div class="product">
        <div class="pic">🏗️</div>
        <div class="product-body">
          <h3 data-i18n="construction"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

      <div class="product">
        <div class="pic">🚗</div>
        <div class="product-body">
          <h3 data-i18n="automotive"></h3>
          <span class="muted" data-i18n="searchRealSources"></span>
        </div>
      </div>

    </div>
  </div>

  <div class="coverage">

    <div class="coverage-card">

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

let currentLang =
  localStorage.getItem("nova_language") || "ar";

function tr(key, vars = {}) {
  let value =
    TEXT[currentLang]?.[key] ??
    TEXT.en[key] ??
    key;

  for (const [k,v] of Object.entries(vars)) {
    value = value.replaceAll(`{${k}}`, String(v));
  }

  return value;
}

function esc(value) {
  return String(value ?? "")
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));
}

function formatNumber(value, decimals = 2) {
  const n = Number(value);

  if (!Number.isFinite(n)) return tr("unknown");

  return new Intl.NumberFormat(
    currentLang === "ar" ? "ar-IQ" : "en-US",
    {maximumFractionDigits:decimals}
  ).format(n);
}

function money(value, currency = "USD") {
  const n = Number(value);

  if (!Number.isFinite(n)) return tr("unknown");

  try {
    return new Intl.NumberFormat(
      currentLang === "ar" ? "ar-IQ" : "en-US",
      {
        style:"currency",
        currency:currency || "USD",
        maximumFractionDigits:2
      }
    ).format(n);
  } catch {
    return `${formatNumber(n)} ${currency || "USD"}`;
  }
}

function countryName(code) {
  if (!code) return tr("unknown");

  try {
    return new Intl.DisplayNames(
      [currentLang === "ar" ? "ar" : "en"],
      {type:"region"}
    ).of(code) || code;
  } catch {
    return COUNTRIES.find(x => x[0] === code)?.[1] || code;
  }
}

function setBusy(button, busy) {
  if (!button) return;

  button.disabled = busy;

  if (busy) {
    button.dataset.original = button.innerHTML;
    button.innerHTML = `<span class="loader"></span>${esc(tr("generating"))}`;
  } else if (button.dataset.original) {
    button.innerHTML = button.dataset.original;
  }
}

function toast(message, type = "") {
  const el = $("toast");

  el.textContent = message;
  el.className =
    `toast show ${type === "success" ? "success" :
    type === "error" ? "error" : ""}`;

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    el.className = "toast";
  }, 3500);
}

async function api(path, options = {}) {

  const config = {
    credentials:"include",
    ...options,
    headers:{
      ...(options.body ? {"Content-Type":"application/json"} : {}),
      ...(options.headers || {})
    }
  };

  let response;

  try {
    response = await fetch(API + path, config);
  } catch {
    throw new Error(
      currentLang === "ar"
        ? "تعذر الاتصال بخادم NOVA."
        : "Could not connect to NOVA server."
    );
  }

  let data = null;

  try {
    data = await response.json();
  } catch {
    throw new Error(
      currentLang === "ar"
        ? `استجابة غير صالحة من الخادم (${response.status}).`
        : `Invalid server response (${response.status}).`
    );
  }

  if (!response.ok) {
    throw new Error(
      data?.error ||
      data?.message ||
      `${tr("requestFailed")} (${response.status})`
    );
  }

  return data;
}

function applyLanguage() {

  document.documentElement.lang = currentLang;
  document.documentElement.dir =
    currentLang === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = tr(el.dataset.i18n);
  });

  document.querySelectorAll("[data-placeholder]").forEach(el => {
    el.placeholder = tr(el.dataset.placeholder);
  });

  $("language").value = currentLang;

  renderCountries();
  renderCategories();

  document.title =
    currentLang === "ar"
      ? "NOVA — المشتريات العالمية بالذكاء الاصطناعي"
      : "NOVA — Global AI Procurement";
}

function initLanguage() {

  $("language").innerHTML = `

    <option value="en">English</option>
  `;

  $("language").value = currentLang;

  $("language").addEventListener("change", e => {

    ).join("");

function go(page) {

  document.querySelectorAll(".page")
    .forEach(el => el.classList.remove("active"));

  const target = $(page);

  if (!target) return;

  target.classList.add("active");

  document.querySelectorAll("[data-page]")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.page === page
      );
    });

  $("nav").classList.remove("open");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if (page === "deals") loadDeals();
  if (page === "history") loadPurchases();
  if (page === "account") {
    checkAccount();
    checkHealth();
  }
}

function toggleNav() {
  $("nav").classList.toggle("open");
}

document.querySelectorAll("[data-page]")
  .forEach(button => {
    button.onclick = () => go(button.dataset.page);
  });

async function searchSuppliers() {

  const request = $("query").value.trim();
  const quantity = Number($("quantity").value || 0);
  const destination = $("destination").value;

  if (!request) {
    toast(tr("invalidInput"), "error");
    return;
  }

  const button = $("searchBtn");

  button.disabled = true;

  $("searchStatus").innerHTML =
    `<span class="loader"></span>${esc(tr("searching"))}`;

  $("results").innerHTML = "";

  try {

    const data = await api("/api/search", {
      method:"POST",
      body:JSON.stringify({
        request,
        quantity,
        destination
      })
    });

    const results =
      Array.isArray(data.results)
        ? data.results
        : Array.isArray(data.suppliers)
          ? data.suppliers
          : [];

    $("searchStatus").textContent =
      tr("foundResults",{n:results.length});

    if (!results.length) {

      $("results").innerHTML =
        `<div class="card empty">${esc(tr("noResults"))}</div>`;

      return;
    }

    $("results").innerHTML =
      results.map(renderSupplier).join("");

  } catch (error) {

    $("searchStatus").innerHTML =
      `<span class="err">${esc(error.message)}</span>`;

  } finally {
    button.disabled = false;
  }
}

      </div>

        supplier.snippet
          ? `<p class="muted">${esc(supplier.snippet)}</p>`

        <div class="metric">
          <small>${esc(tr("price"))}</small>

function supplierToRFQ(encoded) {

  const s = decodeSupplier(encoded);

  $("rfqProduct").value =
    $("query").value ||
    s.product ||
    "";

  $("rfqQuantity").value =
    $("quantity").value || "";

  if ($("destination").value) {
    $("rfqDestination").value =
      $("destination").value;
  }

  const name =
    s.title ||
    s.name ||
    s.supplier ||
    s.company ||
    "";

  const lines = [];

  if (name) {
    lines.push(`${tr("supplier")}: ${name}`);
  }

  if (s.url) {
    lines.push(`${tr("source")}: ${s.url}`);
  }

  if (s.price != null) {
    lines.push(
      `${tr("price")}: ${s.price} ${s.currency || "USD"}`
    );
  }

  if (s.moq != null) {
    lines.push(`${tr("moq")}: ${s.moq}`);
  }

  if (s.leadTime || s.lead_time) {
    lines.push(
      `${tr("leadTime")}: ${s.leadTime || s.lead_time}`
    );
  }

  $("rfqRequirements").value =
    lines.join("\n");

  go("rfq");
}

  $("quantity").value = "";
  $("destination").value = "";
  $("searchStatus").textContent = "";
  $("results").innerHTML = "";
}

   RFQ
========================================================= */

async function createRFQ() {

  const product = $("rfqProduct").value.trim();
  const quantity = Number($("rfqQuantity").value || 0);
  const destination = $("rfqDestination").value;
  const requirements = $("rfqRequirements").value.trim();
  const incoterm = $("rfqIncoterm").value.trim();

  if (!product) {
    toast(tr("invalidInput"),"error");
    return;
  }

  const button = $("rfqBtn");

  button.disabled = true;
  $("rfqStatus").textContent = tr("generating");

  try {

    const data = await api("/api/rfq",{
      method:"POST",
      body:JSON.stringify({
        product,
        quantity,
        destination,
        requirements:
          [
            requirements,
            incoterm
              ? `Incoterm requested: ${incoterm}`
              : ""
          ].filter(Boolean).join("\n")
      })
    });

    const message =
      data.message ||
      data.result ||
      data.rfq;

    if (!message) {
      throw new Error(
        currentLang === "ar"
          ? "لم يُرجع الخادم نص RFQ."
          : "Server returned no RFQ text."
      );
    }

    $("rfqOutput").className = "copy";
    $("rfqOutput").textContent = message;

    $("rfqStatus").innerHTML =
      `<span class="ok">${esc(tr("rfqCreated"))}</span>`;

  } catch (error) {

    $("rfqStatus").innerHTML =
      `<span class="err">${esc(error.message)}</span>`;

  } finally {
    button.disabled = false;
  }
}

async function copyRFQ() {

  const text = $("rfqOutput").textContent.trim();

  if (!text || text === "—") return;

  try {
    await navigator.clipboard.writeText(text);
    toast(tr("copied"),"success");
  } catch {
    toast(
      currentLang === "ar"
        ? "تعذر النسخ تلقائيًا."
        : "Automatic copy failed.",
      "error"
    );
  }
}

/* =========================================================
   NEGOTIATION
   أسماء الحقول هنا مطابقة للـ worker.js الحالي:
   supplier / offer / quantity / target / reply
========================================================= */

async function negotiate() {

  const supplier = $("negSupplier").value.trim();
  const offer = $("negOffer").value.trim();
  const target = $("negTarget").value.trim();
  const quantity = $("negQuantity").value.trim();
  const reply = $("negReply").value.trim();

  if (!supplier || !offer) {
    toast(tr("invalidInput"),"error");
    return;
  }

  const button = $("negBtn");

  button.disabled = true;

  $("negOutput").className = "empty";
  $("negOutput").innerHTML =
    `<span class="loader"></span>`;

  try {

    const data = await api("/api/negotiate",{
      method:"POST",
      body:JSON.stringify({
        supplier,
        offer,
        quantity,
        target,
        reply
      })
    });

    const result = data.result;

    if (!result) {
      throw new Error(
        currentLang === "ar"
          ? "لم يُرجع الذكاء الاصطناعي تحليلاً."
          : "AI returned no negotiation analysis."
      );
    }

    $("negOutput").className = "copy";
    $("negOutput").textContent =
      typeof result === "string"
        ? result
        : JSON.stringify(result,null,2);

  } catch (error) {

    $("negOutput").className = "empty err";
    $("negOutput").textContent = error.message;

  } finally {
    button.disabled = false;
  }
}


/* =========================================================
   DEALS — DATABASE ONLY
========================================================= */

async function loadDeals() {

  $("dealsOutput").className = "card empty";
  $("dealsOutput").innerHTML =
    `<span class="loader"></span>`;

  try {

    const data = await api("/api/deals");

    const deals =
      Array.isArray(data.deals)
        ? data.deals
        : [];

    if (!deals.length) {

      $("dealsOutput").className = "card empty";
      $("dealsOutput").textContent = tr("noDeals");
      return;
    }

    $("dealsOutput").className = "";

    $("dealsOutput").innerHTML =
      deals.map(deal => `

        <article class="result">

          <div class="result-top">

            <div class="avatar">🔥</div>

            <div>
              <span class="badge">
                ${esc(deal.country || "GLOBAL")}
              </span>

              <h3>${esc(deal.product || tr("unknown"))}</h3>

              <div class="muted">
                ${esc(deal.company || tr("unknown"))}
              </div>
            </div>

          </div>

          ${
            deal.description
              ? `<p>${esc(deal.description)}</p>`
              : ""
          }

          <div class="metrics">

            <div class="metric">
              <small>${esc(tr("price"))}</small>
              <b>${
                deal.price != null
                  ? esc(money(deal.price,deal.currency || "USD"))
                  : esc(tr("unknown"))
              }</b>
            </div>

            <div class="metric">
              <small>${esc(tr("quantity"))}</small>
              <b>${esc(formatNumber(deal.quantity))}</b>
            </div>

            <div class="metric">
              <small>${esc(tr("moq"))}</small>
              <b>${esc(formatNumber(deal.moq))}</b>
            </div>

            <div class="metric">
              <small>Expiry</small>
              <b>${esc(deal.expires_at || tr("unknown"))}</b>
            </div>

          </div>

          ${
            deal.url
              ? `<a class="source-link"
                   href="${esc(deal.url)}"
                   target="_blank"
                   rel="noopener noreferrer">
                   🔗 ${esc(tr("source"))}
                 </a>`
              : ""
          }

        </article>

      `).join("");

  } catch (error) {

    $("dealsOutput").className = "card empty err";
    $("dealsOutput").textContent = error.message;
  }
}

/* =========================================================
   ACCOUNT
========================================================= */

function accountCredentials() {

  return {
    email:$("email").value.trim(),
    password:$("password").value
  };
}

async function login() {

  const credentials = accountCredentials();

  if (!credentials.email || !credentials.password) {
    toast(tr("invalidInput"),"error");
    return;
  }

  try {

    const data = await api("/api/login",{
      method:"POST",
      body:JSON.stringify(credentials)
    });

    $("accountOutput").innerHTML =
      `<span class="ok">
        ${esc(tr("loggedIn"))}: ${esc(data.email || credentials.email)}
      </span>`;

    $("password").value = "";

    toast(tr("loggedIn"),"success");

  } catch (error) {

    $("accountOutput").innerHTML =
      `<span class="err">${esc(error.message)}</span>`;
  }
}

async function signup() {

  const credentials = accountCredentials();

  if (
    !credentials.email ||
    credentials.password.length < 6
  ) {
    toast(
      currentLang === "ar"
        ? "أدخل بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل."
        : "Enter a valid email and a password of at least 6 characters.",
      "error"
    );
    return;
  }

  try {

    const data = await api("/api/signup",{
      method:"POST",
      body:JSON.stringify(credentials)
    });

    $("accountOutput").innerHTML =
      `<span class="ok">
        ${esc(tr("loggedIn"))}: ${esc(data.email || credentials.email)}
      </span>`;

    $("password").value = "";

    toast(tr("loggedIn"),"success");

  } catch (error) {

    $("accountOutput").innerHTML =
      `<span class="err">${esc(error.message)}</span>`;
  }
}

async function logout() {

  try {

    await api("/api/logout",{
      method:"POST"
    });

    $("accountOutput").innerHTML =
      `<span>${esc(tr("loggedOut"))}</span>`;

    toast(tr("loggedOut"),"success");

  } catch (error) {

    $("accountOutput").innerHTML =
      `<span class="err">${esc(error.message)}</span>`;
  }
}

async function checkAccount() {

  try {

    const data = await api("/api/me");

    if (data.loggedIn && data.user) {

      $("accountOutput").innerHTML =
        `<span class="ok">
          ${esc(tr("loggedIn"))}: ${esc(data.user.email || "")}
        </span>`;

    } else {

      $("accountOutput").textContent =
        tr("notLoggedIn");
    }

  } catch (error) {

    $("accountOutput").innerHTML =
      `<span class="err">${esc(error.message)}</span>`;
  }
}


/* =========================================================
   HEALTH
========================================================= */

function healthValue(element,value) {

  element.textContent =
    value
      ? tr("connected")
      : tr("notConnected");

  element.className =
    value
      ? "connected"
      : "disconnected";
}

async function checkHealth() {

  try {

    const data = await api("/api/health");

    healthValue(
      $("healthNova"),
      Boolean(data.ok)
    );

    healthValue(
      $("healthDB"),
      Boolean(data.database)
    );

    healthValue(
      $("healthAI"),
      Boolean(data.ai)
    );

    healthValue(
      $("healthSearch"),
      Boolean(data.yep)
    );

    $("onlineState").textContent =
      data.ok
        ? tr("online")
        : tr("offline");

    $("onlineState").className =
      data.ok
        ? "connected"
        : "disconnected";

    $("aiState").textContent =
      data.ai
        ? tr("online")
        : tr("offline");

    $("aiState").className =
      data.ai
        ? "connected"
        : "disconnected";

    $("healthSmall").textContent =
      data.database
        ? tr("connected")
        : tr("notConnected");

  } catch {

    ["healthNova","healthDB","healthAI","healthSearch"]
      .forEach(id => {
        healthValue($(id),false);
      });

    $("onlineState").textContent =
      tr("offline");

    $("onlineState").className =
      "disconnected";

    $("aiState").textContent =
      tr("offline");

    $("aiState").className =
      "disconnected";

    $("healthSmall").textContent =
      tr("notConnected");
  }
}


/* =========================================================
   REAL NETWORK COUNT
========================================================= */

async function loadNetwork() {

  try {

    const data = await api("/api/network");

    $("networkRecords").textContent =
      formatNumber(
        Number(data.actualRecords || 0),
        0
      );

  } catch {

    $("networkRecords").textContent = "—";
  }
}


/* =========================================================
   INIT
========================================================= */

async function initNOVA() {

  initLanguage();

  await Promise.allSettled([
    checkHealth(),
    loadNetwork()
  ]);
}

initNOVA();
