<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA — AI Procurement</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f7f9fc;
      color: #172033;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #667085;
      font-size: 18px;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      padding: 14px 24px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .info {
      background: white;
      border: 1px solid #e1e6ef;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .result {
      background: white;
      border: 1px solid #e1e6ef;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
    }

    .result h3 {
      margin-top: 0;
    }

    .result a {
      color: #2563eb;
      word-break: break-all;
    }

    .snippet {
      color: #4b5563;
      line-height: 1.5;
      margin-top: 10px;
    }

    .source {
      color: #667085;
      font-size: 13px;
      margin-top: 10px;
    }

    .error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>NOVA</h1>

  <div class="subtitle">
    Your AI Purchasing Agent
  </div>

  <textarea
    id="procurementInput"
    placeholder="Example: I need 1000 stainless steel water bottles with my logo, wholesale price, delivered to Dubai">
  </textarea>

  <button id="searchButton" onclick="startSearch()">
    Search with Nova
  </button>

  <div id="status"></div>

  <div id="results"></div>

<script>

async function startSearch() {

  const input =
    document.getElementById("procurementInput");

  const button =
    document.getElementById("searchButton");

  const status =
    document.getElementById("status");

  const resultsBox =
    document.getElementById("results");

  const request =
    input.value.trim();

  if (!request) {
    status.textContent =
      "Please enter what you want to buy.";
    return;
  }

  button.disabled = true;

  status.textContent =
    "NOVA is searching real web results...";

  resultsBox.innerHTML = "";

  try {

    const response = await fetch("/api/search", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        request: request
      })

    });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Search failed"
      );

    }


    /*
      IMPORTANT:
      The new Worker returns results
      directly inside data.results
    */

    const rawResults =
      Array.isArray(data.results)
        ? data.results
        : [];


    if (rawResults.length === 0) {

      status.textContent =
        "NOVA did not find results.";

      resultsBox.innerHTML = `

        <div class="error">

          NOVA connected to the search system,
          but no usable results were returned.

          <br><br>

          Sources checked:
          ${escapeHtml(
            String(data.sourcesChecked || 0)
          )}

          <br>

          Successful sources:
          ${escapeHtml(
            String(data.successfulSources || 0)
          )}

          <br><br>

          Query:
          ${escapeHtml(
            String(data.query || request)
          )}

        </div>

      `;

      return;

    }


    status.textContent =
      "NOVA found " +
      rawResults.length +
      " real web results.";


    resultsBox.innerHTML = `

      <div class="info">

        <strong>
          NOVA Search
        </strong>

        <br><br>

        Sources checked:
        ${escapeHtml(
          String(data.sourcesChecked || 0)
        )}

        <br>

        Successful sources:
        ${escapeHtml(
          String(data.successfulSources || 0)
        )}

        <br>

        Results:
        ${escapeHtml(
          String(rawResults.length)
        )}

      </div>

    `;


    rawResults.forEach(
      (item, index) => {

        const title =
          item.title ||
          "Untitled result";

        const url =
          item.url ||
          "";

        const snippet =
          item.snippet ||
          item.content ||
          item.description ||
          "";

        const source =
          item.source ||
          "Web search";


        resultsBox.innerHTML += `

          <div class="result">

            <h3>
              ${index + 1}.
              ${escapeHtml(title)}
            </h3>

            ${
              url
              ? `
                <div>
                  <a
                    href="${escapeAttribute(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Open supplier / website
                  </a>
                </div>
              `
              : ""
            }

            ${
              snippet
              ? `
                <div class="snippet">
                  ${escapeHtml(snippet)}
                </div>
              `
              : ""
            }

            <div class="source">
              Source:
              ${escapeHtml(source)}
            </div>

          </div>

        `;

      }
    );


  } catch (error) {

    status.textContent =
      "Search error.";

    resultsBox.innerHTML = `

      <div class="error">

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  } finally {

    button.disabled = false;

  }

}


function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(text) {

  return String(text)

    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}

</script>

</body>
  </html>
