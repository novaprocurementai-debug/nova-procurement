<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — AI Procurement</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7fa;color:#111}
main{max-width:900px;margin:auto;padding:25px}
textarea{width:100%;height:100px;padding:12px;font-size:16px;box-sizing:border-box}
button{margin-top:10px;padding:12px 18px;background:#111;color:white;border:0;border-radius:8px;font-size:15px}
.card{background:white;padding:18px;margin-top:15px;border-radius:12px;box-shadow:0 2px 8px #ddd}
a{color:#06c}
.quote{background:#0b57d0}
</style>
</head>
<body>
<main>
<h1>🧠 NOVA</h1>
<p>Your AI Purchasing Agent</p>

<textarea id="req" placeholder="What do you want to buy?"></textarea>
<button onclick="search()">Search with Nova</button>

<div id="status"></div>
<div id="results"></div>
</main>

<script>
async function search(){
 const req=document.getElementById("req").value.trim();
 if(!req)return;

 status.innerHTML="<p>🔎 NOVA is searching...</p>";
 results.innerHTML="";

 try{
  const r=await fetch("/api/search",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({request:req})
  });
  const data=await r.json();

  if(!data.results?.length){
   status.innerHTML="<p>❌ No results found.</p>";
   return;
  }

  status.innerHTML=`<p>✅ ${data.results.length} suppliers found</p>`;

  results.innerHTML=data.results.map((x,i)=>`
   <div class="card">
    <h2>${i+1}. ${x.title}</h2>
    <p>💰 <b>Price:</b> ${x.price||"Not found"}</p>
    <p>📦 <b>MOQ:</b> ${x.moq||"Not found"}</p>
    <p>⏱️ <b>Lead Time:</b> ${x.leadTime||"Not found"}</p>
    <p>${x.snippet||""}</p>

    <a href="${x.url}" target="_blank">🔗 View Supplier</a>

    <br>
    <button class="quote"
      onclick="requestQuote(${JSON.stringify(x.title)},${JSON.stringify(x.url)})">
      📩 Request Quote
    </button>
   </div>
  `).join("");

 }catch(e){
  status.innerHTML="<p>❌ Search error</p>";
 }
}

function requestQuote(title,url){
 const product=document.getElementById("req").value.trim();

 const subject=encodeURIComponent("Request for Quotation - "+product);

 const body=encodeURIComponent(
`Hello,

I am interested in purchasing:

Product: ${product}

Supplier found:
${title}
${url}

Please provide:
- Unit price
- MOQ
- Shipping cost
- Lead time
- Payment terms
- Sample availability

Thank you.`
 );

 window.location.href=`mailto:?subject=${subject}&body=${body}`;
}
</script>
</body>
</html>
