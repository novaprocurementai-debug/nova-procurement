function restoreSources(){for(const [n,s]of sourceTexts)if(n.isConnected&&!((lang==="ar"||lang==="en")&&n.parentElement?.closest("[data-i]")))n.nodeValue=s;for(const [el,attrs]of sourceAttrs){if(!el.isConnected)continue;for(const [k,v]of Object.entries(attrs))if(!(k==="placeholder"&&el.hasAttribute("data-p"))&&v!==null)el.setAttribute(k,v)}}
function renderMarketCards(){const e=$("marketCards");if(!e)return;const featured=["CN","IN","US","DE","TR","AE","SA","IQ","GB","IT","FR","JP","KR","VN","TH","MY","ID","BR","MX","EG","ZA","PL","NL","CA","AU","SG","PK","BD","ES","RU","QA","KW"];e.innerHTML=featured.map(c=>`<button class="market-card" data-country="${c}" data-no-translate>🌐 ${esc(cname(c))}</button>`).join("");e.querySelectorAll("[data-country]").forEach(b=>b.onclick=()=>{$("countryExplorer").value=b.dataset.country;searchSelectedMarket()})}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.body.style.direction=lang==="ar"?"rtl":"ltr";document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));$("language").value=lang;fillCountries();renderMarketCards();document.title=({ar:"NOVA — المشتريات العالمية الذكية",en:"NOVA — Global Procurement Intelligence",fr:"NOVA — Achats mondiaux",es:"NOVA — Compras globales",de:"NOVA — Globale Beschaffung","zh-CN":"NOVA — 全球采购",ja:"NOVA — グローバル調達",ru:"NOVA — Глобальные закупки",tr:"NOVA — Küresel Tedarik",hi:"NOVA — वैश्विक खरीद",pt:"NOVA — Compras globais",it:"NOVA — Approvvigionamento globale"})[lang]||"NOVA — Global Procurement"}
function translatePage(){const v=generation;jobs=[];scan(document.body,lang,v);if(observer)observer.observe(document.body,{childList:true,subtree:true})}
function novaSetLanguage(target){if(!SUPPORTED.has(target))return;generation++;if(observer)observer.disconnect();restoreSources();lang=target;try{localStorage.setItem("nova_language",lang)}catch{}applyLang();translationWarned=false;$("translationStatus").textContent=lang==="en"||lang==="ar"?"":t("loadingTranslation");translatePage()}
window.novaSetLanguage=novaSetLanguage;
function installObserver(){observer=new MutationObserver(records=>{for(const r of records)if(r.type==="childList")r.addedNodes.forEach(n=>scan(n,lang,generation))});observer.observe(document.body,{childList:true,subtree:true})}
try{const saved=localStorage.getItem("nova_language");if(SUPPORTED.has(saved))lang=saved}catch{}
function go(id){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===id));if(id==="tracking")setTimeout(()=>{if(mainMap)mainMap.invalidateSize()},160);window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function status(id,msg,type=""){const e=$(id);if(e){e.textContent=msg||"";e.className="status "+type}}
async function search(query,dest,target){query=String(query||"").trim();if(!query){toast(t("searchPrompt"),"error");return}const box=$(target);box.innerHTML=`<div class="status">${esc(t("loading"))}</div>`;try{const request=dest?`${query} suppliers in ${cname(dest)} ${dest}`:query;const d=await api("/api/search",{method:"POST",body:JSON.stringify({request,quantity:Number($("quantity")?.value||500),destination:dest||""})});const arr=Array.isArray(d.results)?d.results:Array.isArray(d.suppliers)?d.suppliers:Array.isArray(d.items)?d.items:Array.isArray(d.organic)?d.organic:Array.isArray(d.data?.results)?d.data.results:[];lastResults=arr;renderResults(arr,target);if(target==="results")status("searchStatus",arr.length?`${arr.length} ${t("count")}`:t("noResults"),arr.length?"success":"")}catch(e){box.innerHTML=`<div class="status error">${esc(e.message)} — ${esc(t("searchDesc"))}</div>`}}
function renderResults(arr,target){const box=$(target);if(!arr.length){box.innerHTML=`<div class="status">${esc(t("noResults"))}</div>`;return}box.innerHTML=arr.slice(0,50).map((x,i)=>{const title=x.title||x.name||x.company||x.supplier||t("unknown"),url=x.url||x.link||"",desc=x.snippet||x.description||t("noDescription"),price=x.price??x.unitPrice??x.displayed_price;return `<article class="result"><h3>${esc(title)}</h3><p>${esc(desc)}</p><div class="supplier-meta">${esc(x.country||x.location||"")}</div>${price!=null?`<p><b>${esc(t("price"))}: ${esc(price)} ${esc(x.currency||"")}</b></p>`:""}${url&&/^https?:\/\//i.test(url)?`<a class="source-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(t("source"))} ↗</a>`:""}<div class="actions"><button class="btn secondary" onclick="useSupplier(${i})">${esc(t("details"))}</button></div></article>`}).join("")}
function useSupplier(i){const x=lastResults[i];if(!x)return;$("negSupplier").value=x.title||x.name||x.company||x.supplier||"";if(x.price)$("negOffer").value=Number(String(x.price).replace(/[^\d.]/g,""))||"";go("negotiation")}
function searchSuppliers(){search($("query").value,$("destination").value,"results")}
function dashboardSearch(){search($("dashQuery").value,$("dashCountry").value,"dashResults")}
function quickSearch(q){$("heroQuery").value=q;$("query").value=q;go("search");searchSuppliers()}
function heroSearch(){const q=$("heroQuery").value.trim();if(!q){toast(t("searchPrompt"),"error");return}$("query").value=q;$("destination").value=$("homeCountry").value;go("search");searchSuppliers()}
function clearSearch(){$("query").value="";$("results").innerHTML="";status("searchStatus","")}
async function createRFQ(){const product=$("rfqProduct").value.trim(),quantity=Number($("rfqQuantity").value);if(!product||quantity<1){toast(t("invalid"),"error");return}status("rfqOutput",t("loading"));try{const d=await api("/api/rfq",{method:"POST",body:JSON.stringify({product,quantity,destination:$("rfqDestination").value,incoterm:$("rfqIncoterm").value,requirements:$("rfqRequirements").value})});$("rfqOutput").textContent=JSON.stringify(d.result||d.rfq||d.message||d,null,2);toast(t("rfqSuccess"),"success")}catch(e){status("rfqOutput",e.message,"error")}}
async function calculateLanded(){const b={unitPrice:Number($("unitPrice").value),quantity:Number($("landedQuantity").value),shipping:Number($("shipping").value)||0,insurance:Number($("insurance").value)||0,dutyPercent:Number($("duty").value)||0,taxPercent:Number($("tax").value)||0,localDelivery:Number($("localDelivery").value)||0};if(!Number.isFinite(b.unitPrice)||b.unitPrice<0||b.quantity<1){toast(t("invalid"),"error");return}let v;try{const d=await api("/api/landed-cost",{method:"POST",body:JSON.stringify(b)});v=d.result||d}catch{const goods=b.unitPrice*b.quantity,duty=goods*b.dutyPercent/100,tax=(goods+duty)*b.taxPercent/100;v={goods,shipping:b.shipping,insurance:b.insurance,duty,tax,localDelivery:b.localDelivery,total:goods+b.shipping+b.insurance+duty+tax+b.localDelivery,estimateOnly:true}}if(v.total==null){v.total=(v.goods??b.unitPrice*b.quantity)+(v.shipping??b.shipping)+(v.insurance??b.insurance)+(v.duty??0)+(v.tax??0)+(v.localDelivery??b.localDelivery);v.unitLanded=v.total/b.quantity}const e=$("landedOutput");e.innerHTML=`<div class="total-box"><small>${esc(t("landedTotal"))}${v.estimateOnly?" · "+esc(t("estimateOnly")):""}</small><strong>${esc(money(v.total))}</strong><small>${esc(t("unitLanded"))}: ${esc(money(v.unitLanded??v.total/b.quantity))}</small></div><div class="metrics">${[["goods",v.goods??b.unitPrice*b.quantity],["shipping",v.shipping??b.shipping],["insurance",v.insurance??b.insurance],["dutyPercent",v.duty],["taxPercent",v.tax],["localDelivery",v.localDelivery??b.localDelivery]].filter(a=>a[1]!=null).map(a=>`<div class="metric"><small>${esc(t(a[0]))}</small><b>${esc(money(a[1]))}</b></div>`).join("")}</div><p class="status">${esc(t("landedStatus"))}</p>`}
async function negotiate(){const supplier=$("negSupplier").value.trim(),offer=Number($("negOffer").value),target=Number($("negTarget").value)||0,quantity=Number($("negQuantity").value)||1,reply=$("negReply").value.trim();if(!supplier||!Number.isFinite(offer)||offer<=0){toast(t("invalid"),"error");return}status("negOutput",t("loading"));try{const d=await api("/api/negotiate",{method:"POST",body:JSON.stringify({supplier,offer,target,quantity,reply})});$("negOutput").textContent=typeof d.result==="string"?d.result:JSON.stringify(d.result??d,null,2)}catch{const gap=target>0?((offer-target)/offer*100):0;$("negOutput").textContent=`${t("negLocal")}\n${t("currentOffer")}: ${money(offer)}\n${t("targetPrice")}: ${money(target||offer)}\n${t("quantity")}: ${fmt(quantity)}\n${target>0?gap.toFixed(1)+"%":""}\n${t("negotiationNote")}`}}
async function loadDeals(){const e=$("dealsOutput");e.innerHTML=`<p class="status">${esc(t("loading"))}</p>`;try{const d=await api("/api/deals"),arr=Array.isArray(d.deals)?d.deals:[];e.innerHTML=arr.length?arr.map(x=>`<article class="supplier-row"><div class="supplier-art">🔥</div><div><strong>${esc(x.product||t("unknown"))}</strong><p>${esc(x.company||"")} · ${esc(x.country||"")}</p><b>${esc(x.price!=null?money(x.price,x.currency||"USD"):t("unknown"))}</b><p>${esc(x.description||"")}</p>${x.url&&/^https?:\/\//i.test(x.url)?`<a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(t("source"))}</a>`:""}</div></article>`).join(""):`<p class="status">${esc(t("noDeals"))}</p>`}catch(err){e.textContent=err.message}}
async function loadPurchases(){const e=$("purchasesOutput");e.innerHTML=`<p class="status">${esc(t("loading"))}</p>`;try{const d=await api("/api/purchases"),arr=Array.isArray(d.purchases)?d.purchases:[];e.innerHTML=arr.length?arr.map(x=>`<article class="supplier-row"><div class="supplier-art">🧾</div><div><strong>${esc(x.product||t("unknown"))}</strong><p>${esc(x.supplier||"")}</p><div class="metrics"><div class="metric"><small>${esc(t("quantity"))}</small><b>${esc(fmt(x.quantity))}</b></div><div class="metric"><small>${esc(t("landedTotal"))}</small><b>${esc(money(x.landed_cost))}</b></div></div></div></article>`).join(""):`<p class="status">${esc(t("noPurchases"))}</p>`}catch(err){e.textContent=err.message}}
async function accountAction(path){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){toast(t("invalid"),"error");return}try{const d=await api(path,{method:"POST",body:JSON.stringify({email,password})});$("accountOutput").textContent=JSON.stringify(d,null,2);toast(t("success"),"success")}catch(e){status("accountOutput",e.message,"error")}}
function login(){return accountAction("/api/login")}function signup(){return accountAction("/api/signup")}
async function logout(){try{const d=await api("/api/logout",{method:"POST"});$("accountOutput").textContent=JSON.stringify(d,null,2)}catch(e){status("accountOutput",e.message,"error")}}
function health(id,ok){$(id).textContent=ok?t("connected"):t("notConnected")}
async function checkHealth(){try{const d=await api("/api/health");health("healthNova",!!d.ok);health("healthDB",!!d.database);health("healthAI",!!d.ai);health("healthSearch",!!d.yep)}catch{["healthNova","healthDB","healthAI","healthSearch"].forEach(id=>health(id,false))}}
function initMap(){if(typeof L==="undefined"){status("trackingStatus",t("mapError"),"error");return}mainMap=L.map("mainMap",{worldCopyJump:true,scrollWheelZoom:false}).setView([25,40],2);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(mainMap);Object.keys(activeLayers).forEach(k=>markers[k]=L.layerGroup().addTo(mainMap))}
function toggleLayer(key,button){activeLayers[key]=!activeLayers[key];button.classList.toggle("active",activeLayers[key]);if(mainMap&&markers[key]){if(activeLayers[key])markers[key].addTo(mainMap);else mainMap.removeLayer(markers[key])}}
function pointOf(p){const lat=Number(p.lat??p.latitude??p.LAT),lon=Number(p.lon??p.lng??p.longitude??p.LON);return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180?{lat,lon}:null}
function iconFor(type){return {aircraft:"✈️",vessels:"🚢",trains:"🚆",road:"🚚"}[type]||"•"}
async function refreshTracking(){if(!mainMap)initMap();if(!mainMap){toast(t("mapError"),"error");return}status("trackingStatus",t("loading"));const b=mainMap.getBounds(),bbox=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].join(","),types=Object.keys(activeLayers).filter(k=>activeLayers[k]),rows=[];const responses=await Promise.allSettled(types.map(async type=>{const d=await api(`/api/tracking/${type}?bbox=${encodeURIComponent(bbox)}`);if(d.configured===false)return {type,items:[],message:d.message||t("trackingNotConfigured")};const a=Array.isArray(d.positions)?d.positions:Array.isArray(d.states)?d.states:Array.isArray(d.results)?d.results:[];return {type,items:a.map(p=>({p,xy:pointOf(p)})).filter(x=>x.xy),message:d.message||""}}));responses.forEach((r,i)=>{const type=types[i];markers[type].clearLayers();if(r.status!=="fulfilled"){rows.push(`<tr><td>${esc(t(type))}</td><td colspan="4">${esc(r.reason?.message||t("trackingNotConfigured"))}</td></tr>`);return}if(r.value.message)rows.push(`<tr><td>${esc(t(type))}</td><td colspan="4">${esc(r.value.message)}</td></tr>`);r.value.items.forEach(({p,xy})=>{const name=p.name||p.callsign||p.flight||p.shipName||p.ShipName||p.vehicle_id||p.id||p.mmsi||p.MMSI||iconFor(type),speed=p.speed??p.velocity??p.Sog??p.SPEED??"—",updated=p.timestamp??p.last_seen??p.lastUpdate??"—";const mark=L.marker([xy.lat,xy.lon]).bindPopup(`<b>${esc(name)}</b><br>${esc(t(type))}<br>${xy.lat.toFixed(4)}, ${xy.lon.toFixed(4)}<br>${esc(t("speed"))}: ${esc(speed)}`);markers[type].addLayer(mark);rows.push(`<tr><td>${iconFor(type)} ${esc(t(type))}</td><td>${esc(name)}</td><td>${xy.lat.toFixed(3)}, ${xy.lon.toFixed(3)}</td><td>${esc(speed)}</td><td>${esc(updated)}</td></tr>`)})});$("trackingTable").innerHTML=rows.length?rows.join(""):`<tr><td colspan="5">${esc(t("noLiveData"))}</td></tr>`;status("trackingStatus",rows.length?`${rows.length} · ${t("live")}`:t("noLiveData"))}
async function trackShipment(){const id=$("trackingNumber").value.trim(),carrier=$("carrier").value;if(!id){toast(t("invalid"),"error");return}status("trackOutput",t("loading"));try{const d=await api(`/api/tracking/shipment?tracking=${encodeURIComponent(id)}&carrier=${encodeURIComponent(carrier)}`);$("trackOutput").textContent=JSON.stringify(d.result??d,null,2)}catch(e){status("trackOutput",e.message,"error")}}
function searchSelectedMarket(){const c=$("countryExplorer").value;if(!c){toast(t("emptyDestination"),"error");return}$("homeCountry").value=c;$("dashCountry").value=c;$("query").value="manufacturers suppliers exporters";$("destination").value=c;go("search");searchSuppliers()}
function startup(){const ids=["homeCountry","dashCountry","destination","rfqDestination","countryExplorer"];ids.forEach(id=>{const e=$(id);if(!e)return;e.innerHTML=`<option value="">${esc(t("allCountries"))}</option>`+CODES.map(c=>`<option value="${c}">${esc(cname(c))}</option>`).join("");if(id!=="countryExplorer")e.value="IQ"});$("year").textContent=new Date().getFullYear();applyLang();installObserver();translatePage();initMap();checkHealth()}
startup();
</script>
