
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06172d">
<meta name="description" content="NOVA — Global AI Procurement and Trade Intelligence">
<title>NOVA — Global Procurement AI</title>
<style>
:root{--navy:#06172d;--navy2:#0a2545;--blue:#1769ff;--cyan:#48d9f4;--green:#07966c;--bg:#f2f6fb;--line:#e0e8f1;--text:#13243a;--muted:#718096;--shadow:0 8px 26px #092a4b12}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #48b7ff;outline-offset:2px}
a{color:inherit}
header{position:sticky;top:0;z-index:100;background:#06172df7;color:#fff;border-bottom:1px solid #ffffff18;backdrop-filter:blur(16px)}
.wrap{width:min(1540px,calc(100% - 28px));margin:auto}
.head{min-height:68px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:175px;font-size:25px;font-weight:950;letter-spacing:1px}
.brand-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#1769ff,#46e0e7);box-shadow:0 0 24px #219aff44}
.brand small{display:block;font-size:9px;font-weight:500;letter-spacing:.3px;color:#9bb7d3;margin-top:2px}
.nav{display:flex;align-items:center;gap:3px;flex:1;justify-content:center}
.nav button,.head-action{border:0;background:transparent;color:#d5e3f4;border-radius:9px;padding:10px 11px;font-size:12px;font-weight:750;white-space:nowrap}
.nav button:hover,.nav button.active{background:#1769ff;color:white}
.head-actions{display:flex;align-items:center;gap:7px}
.lang{background:#102b4a;color:white;border:1px solid #31516f;border-radius:9px;padding:9px;max-width:110px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;transition:transform .16s,filter .16s,box-shadow .16s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.primary{background:linear-gradient(135deg,#1769ff,#0a50d8);color:#fff;box-shadow:0 5px 15px #1769ff25}
.secondary{background:#eaf2ff;color:#1654bb;border:1px solid #d4e3ff}
.ghost{background:#fff;color:#25415e;border:1px solid #dce5ef}
.dark-btn{background:#0b2543;color:#fff}
.mobile{display:none;background:#102b4a;color:#fff;border:1px solid #31516f;border-radius:9px;padding:9px 12px}
main{padding:17px 0 60px}
.page{display:none}.page.active{display:block}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:430px;padding:34px;border-radius:23px;color:white;background:linear-gradient(90deg,#031124f5 0%,#062344dc 48%,#092d4d83 100%),url("https://images.unsplash.com/photo-1494412519320-aa613dfb7738?auto=format&fit=crop&w=2200&q=85") center/cover,#071a31;box-shadow:0 18px 55px #05213c30}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 63% 43%,#1cbfff2c,transparent 34%),linear-gradient(0deg,#03122655,transparent 60%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.78fr);gap:26px;align-items:center;min-height:360px}
.hero-copy{position:relative;z-index:2;max-width:780px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid #9bdfff52;background:#04192e9c;border-radius:30px;padding:8px 12px;color:#d5f7ff;font-size:12px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:#38e5a3;box-shadow:0 0 0 5px #38e5a322}
h1{font-size:clamp(35px,4vw,59px);line-height:1.08;letter-spacing:-1.2px;margin:20px 0 13px;text-shadow:0 5px 30px #0005}
h1 span{display:block;color:#39d7db}
.hero-copy>p{max-width:650px;line-height:1.85;color:#d5e8fa;font-size:16px}
.searchbox{display:flex;align-items:center;gap:5px;margin-top:23px;padding:6px;background:white;border:1px solid #d9e9f7;border-radius:13px;box-shadow:0 10px 35px #0003}
.searchbox input{min-width:0;flex:1;border:0;outline:0;padding:12px;color:#13243a;background:transparent}
.searchbox select{max-width:185px;min-width:120px;border:0;border-inline-start:1px solid #e2e8f0;padding:10px;background:#fff;color:#344a60}
.searchbox .btn{font-size:21px;padding:9px 16px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick button{border:1px solid #ffffff4c;background:#fffffff0;color:#1b3550;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:850;box-shadow:0 5px 15px #0002}
.quick button:hover{transform:translateY(-2px)}
.globe{position:absolute;z-index:0;top:50%;left:38%;width:min(42%,480px);aspect-ratio:1;transform:translateY(-50%);opacity:.7;pointer-events:none;filter:drop-shadow(0 0 24px #37cfff35)}
.globe svg{width:100%;height:100%}
.globe-spin{transform-origin:250px 250px;animation:spinGlobe 42s linear infinite}
@keyframes spinGlobe{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:1}}
.ai-panel{position:relative;z-index:3;border:1px solid #9edfff47;border-radius:19px;padding:20px;background:#061a30c9;box-shadow:0 20px 50px #0003;backdrop-filter:blur(13px)}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai-head h2{font-size:19px;margin:0}
.online{color:#62edb1;font-size:11px;font-weight:800}
.ai-panel p{font-size:13px;line-height:1.8;color:#c7d8ea}
.ai-example{padding:13px;border-radius:11px;background:#fff;color:#42566c;font-size:12px;line-height:1.8;margin:14px 0}
.ai-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ai-actions button{padding:11px 9px;border:1px solid #c7e7ff35;border-radius:9px;background:#102f4f;color:#f0f8ff;font-size:12px;font-weight:800;text-align:start}
.ai-actions button:hover{background:#17476e}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:13px 0 20px}
.stat{display:flex;align-items:center;gap:11px;min-width:0;padding:15px;background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.stat-icon{display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:12px;background:#eaf4ff;color:#1769ff;font-size:20px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat strong{display:block;margin:3px 0;font-size:22px}
.stat .sub{font-size:10px;color:var(--muted)}
.section{margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section-head h2{font-size:19px;margin:0 0 4px}
.section-head p{font-size:12px;color:var(--muted);margin:0}
.categories{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px}
.cat{overflow:hidden;text-align:start;padding:0;border:1px solid var(--line);border-radius:13px;background:white;color:var(--text);box-shadow:var(--shadow);font-weight:800;font-size:12px}
.cat-art{display:grid;place-items:center;min-height:75px;font-size:30px;background:linear-gradient(145deg,#dcecff,#f2f7ff)}
.cat span{display:block;padding:10px 9px}
.cat:hover{border-color:#8dbbff;transform:translateY(-2px)}
.workspace{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.8fr) minmax(260px,.72fr);gap:12px;align-items:start}
.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px;border-bottom:1px solid #edf1f6}
.panel-head h3{font-size:14px;margin:0}
.panel-body{padding:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:20px;background:#e8f8f0;color:#08764e;font-size:10px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:800;color:#41556c}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #dce5ef;border-radius:9px;padding:11px;background:white;color:#172b43}
.field textarea{resize:vertical;min-height:88px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.result{padding:13px;border:1px solid #e2eaf3;border-radius:12px;background:#fff;margin-bottom:10px}
.result-top{display:flex;gap:10px;align-items:center}
.avatar{display:grid;place-items:center;flex-shrink:0;width:43px;height:43px;border-radius:11px;background:#e9f3ff;font-size:22px}
.result h3{font-size:14px;margin:0 0 4px}
.muted{color:var(--muted);font-size:11px}
.result-price{font-size:19px;font-weight:900;margin:10px 0 3px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:11px}
.metric{padding:9px;background:#f5f8fc;border-radius:8px;min-width:0}
.metric small{display:block;color:var(--muted);font-size:10px}
.metric b{display:block;font-size:12px;overflow-wrap:anywhere;margin-top:3px}
.source-link{display:inline-block;margin-top:9px;color:#155cce;font-size:11px;font-weight:800}
.status{font-size:12px;margin:10px 0;color:var(--muted)}
.status.error{color:#b4232a}.status.success{color:#08764e}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}
.tools-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.tool{display:flex;align-items:center;gap:11px;text-align:start;border:1px solid var(--line);border-radius:12px;background:white;padding:14px;box-shadow:var(--shadow);font-weight:800;font-size:12px}
.tool i{font-style:normal;font-size:22px}
.market-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.market-card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:white;box-shadow:var(--shadow)}
.market-art{display:grid;place-items:center;min-height:105px;background:linear-gradient(145deg,#dcecff,#eff8ff);font-size:36px}
.market-card div:last-child{padding:11px}
.market-card strong{font-size:12px}
.coverage{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.coverage-card{border-radius:15px;padding:19px;background:linear-gradient(125deg,#0a2342,#104d7b);color:#fff}
.coverage-card h2{margin:0 0 8px;font-size:19px}
.coverage-card p{font-size:12px;line-height:1.8;color:#d1e4f8}
.coverage-number{font-size:38px;font-weight:950;color:#50d9e8}
.countrybox{padding:19px;background:white;border:1px solid var(--line);border-radius:15px}
.countrybox select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white}
.health-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.health-item{padding:13px;border:1px solid var(--line);border-radius:11px;background:white;font-size:12px}
.connected{color:#08764e}.disconnected{color:#b4232a}
.loading{display:inline-block;width:15px;height:15px;border:2px solid #dce8f5;border-top-color:#1769ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{display:none;position:fixed;z-index:300;bottom:20px;inset-inline-end:20px;max-width:min(420px,calc(100% - 40px));padding:13px 17px;border-radius:11px;background:#102b49;color:white;box-shadow:0 10px 30px #0003;font-size:13px}
.toast.show{display:block}.toast.error{background:#b4232a}.toast.success{background:#08764e}
.modal{display:none;position:fixed;inset:0;z-index:250;background:#041124a8;place-items:center;padding:16px}
.modal.open{display:grid}
.modal-card{width:min(680px,100%);max-height:85vh;overflow:auto;background:white;border-radius:16px;padding:20px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
footer{margin-top:35px;padding:23px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
@media(max-width:1180px){.nav{display:none}.nav.open{display:flex;position:absolute;top:68px;inset-inline:14px;flex-direction:column;align-items:stretch;background:#071a31;padding:12px;border-radius:13px;box-shadow:0 12px 30px #0004}.mobile{display:block}.workspace{grid-template-columns:1fr 1fr}.workspace .supplier-panel{grid-column:1/-1}.categories{grid-template-columns:repeat(4,minmax(0,1fr))}.tools-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.wrap{width:calc(100% - 18px)}.head{min-height:61px;gap:8px}.brand{font-size:21px;min-width:auto}.brand small{font-size:8px}.head-actions{margin-inline-start:auto}.head-actions .primary{display:none}.lang{max-width:94px}.hero{padding:21px;min-height:0}.hero-grid{grid-template-columns:1fr;gap:16px}.hero-copy{max-width:none}.globe{width:88%;left:6%;top:25%;opacity:.25}.hero h1{font-size:36px}.hero-copy>p{font-size:14px}.searchbox{flex-wrap:wrap}.searchbox input{flex-basis:65%}.searchbox select{max-width:none;flex:1;min-width:0;border-inline-start:0;border-top:1px solid #e2e8f0}.searchbox .btn{flex:0 0 auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:11px;gap:8px}.stat-icon{width:34px;height:34px;font-size:17px}.stat strong{font-size:19px}.categories{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.cat-art{min-height:53px;font-size:24px}.cat span{font-size:10px;padding:8px 6px}.workspace{grid-template-columns:1fr}.workspace .supplier-panel{grid-column:auto}.market-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.coverage{grid-template-columns:1fr}.tools-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.health-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.section-head h2{font-size:17px}}
@media(max-width:420px){.hero h1{font-size:31px}.ai-actions{grid-template-columns:1fr}.categories{grid-template-columns:repeat(2,minmax(0,1fr))}.brand small{display:none}.nav.open{top:61px}.head{gap:5px}.lang{max-width:84px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div class="brand"><span class="brand-mark">N</span><span>NOVA<small>GLOBAL PROCUREMENT AI</small></span></div>
    <nav class="nav" id="nav">
      <button data-page="home" data-i18n="home"></button>
      <button data-page="search" data-i18n="suppliers"></button>
      <button data-page="rfq" data-i18n="rfq"></button>
      <button data-page="landed" data-i18n="landed"></button>
      <button data-page="negotiation" data-i18n="negotiation"></button>
      <button data-page="deals" data-i18n="deals"></button>
      <button data-page="history" data-i18n="purchases"></button>
      <button data-page="account" data-i18n="account"></button>
    </nav>
    <div class="head-actions">
      <select id="language" class="lang" aria-label="Language">
        <option value="ar">العربية</option><option value="en">English</option>
      </select>
      <button class="btn primary" onclick="go('search')" data-i18n="startBuying"></button>
      <button class="mobile" onclick="toggleNav()" aria-label="Open menu">☰</button>
    </div>
  </div>
</header>

<main class="wrap">
<section id="home" class="page active">
  <div class="hero">
    <div class="globe" aria-hidden="true">
      <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="globeFill" cx="35%" cy="28%" r="78%">
            <stop offset="0" stop-color="#a6f4ff" stop-opacity=".55"/>
            <stop offset=".55" stop-color="#167ad8" stop-opacity=".2"/>
            <stop offset="1" stop-color="#06152d" stop-opacity=".8"/>
          </radialGradient>
          <linearGradient id="globeStroke"><stop stop-color="#c1f8ff"/><stop offset="1" stop-color="#648cff"/></linearGradient>
          <clipPath id="globeClip"><circle cx="250" cy="250" r="158"/></clipPath>
        </defs>
        <circle cx="250" cy="250" r="196" fill="none" stroke="#69dfff" stroke-opacity=".23"/>
        <circle class="globe-spin" cx="250" cy="250" r="178" fill="none" stroke="#69dfff" stroke-opacity=".6" stroke-dasharray="3 10" stroke-width="2"/>
        <circle cx="250" cy="250" r="158" fill="url(#globeFill)" stroke="url(#globeStroke)" stroke-width="2"/>
        <g clip-path="url(#globeClip)" fill="none" stroke="#8cecff" stroke-opacity=".55">
          <ellipse cx="250" cy="250" rx="64" ry="158"/>
          <ellipse cx="250" cy="250" rx="119" ry="158"/>
          <ellipse cx="250" cy="250" rx="158" ry="55"/>
          <ellipse cx="250" cy="250" rx="158" ry="106"/>
          <path d="M90 250H410M105 195H395M105 305H395M250 90V410"/>
          <path d="M120 145L180 166 203 207 184 242 208 270 191 310 220 354"/>
          <path d="M266 102L287 145 320 163 328 199 363 222 345 254 367 289 342 325 306 344 291 386"/>
        </g>
        <g fill="none" stroke="#70ddff" stroke-width="1.5">
          <path d="M167 190Q250 110 326 204T300 316"/>
          <path d="M167 190Q175 275 300 316"/>
          <path d="M326 204Q230 250 211 335"/>
          <ellipse cx="250" cy="250" rx="215" ry="74" transform="rotate(-28 250 250)"/>
          <ellipse cx="250" cy="250" rx="215" ry="75" transform="rotate(46 250 250)" stroke-dasharray="4 8"/>
        </g>
        <g fill="#b8f5ff">
          <circle cx="167" cy="190" r="6"/><circle cx="326" cy="204" r="6"/>
          <circle cx="300" cy="316" r="6"/><circle cx="211" cy="335" r="5"/>
        </g>
      </svg>
    </div>
    <div class="hero-grid">
      <div class="hero-copy">
        <div class="eyebrow"><span class="dot"></span><span data-i18n="verifiedFirst"></span></div>
        <h1><span data-i18n="heroTitle"></span><span data-i18n="heroTitle2"></span></h1>
        <p data-i18n="heroText"></p>
        <div class="searchbox">
          <input id="homeQuery" data-placeholder="searchPlaceholder" aria-label="Product search">
          <select id="homeCountry" aria-label="Country"></select>
          <button class="btn primary" onclick="homeSearch()" aria-label="Search">⌕</button>
        </div>
        <div class="quick">
          <button onclick="quickSearch('wheat grain bulk suppliers')">🌾 <span data-i18n="wheat"></span></button>
          <button onclick="quickSearch('food products manufacturers')">🥬 <span data-i18n="food"></span></button>
          <button onclick="quickSearch('industrial materials manufacturers')">🏭 <span data-i18n="materials"></span></button>
          <button onclick="quickSearch('agricultural machinery manufacturers')">🚜 <span data-i18n="machinery"></span></button>
          <button onclick="quickSearch('vehicle manufacturers exporters')">🚗 <span data-i18n="vehicles"></span></button>
        </div>
      </div>
      <aside class="ai-panel">
        <div class="ai-head"><h2>✦ NOVA AI</h2><span class="online">● <span data-i18n="online"></span></span></div>
        <p data-i18n="aiAssistant"></p>
        <div class="ai-example" data-i18n="aiExample"></div>
        <div class="ai-actions">
          <button onclick="go('search')">🔎 <span data-i18n="findSuppliers"></span></button>
          <button onclick="go('landed')">🧮 <span data-i18n="landed"></span></button>
          <button onclick="go('rfq')">📄 <span data-i18n="createRFQ"></span></button>
          <button onclick="go('negotiation')">🤝 <span data-i18n="startNegotiation"></span></button>
        </div>
      </aside>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span class="stat-icon">♙</span><div><small data-i18n="actualRecords"></small><strong id="networkRecords">—</strong><span class="sub" data-i18n="databaseRecords"></span></div></div>
    <div class="stat"><span class="stat-icon">◎</span><div><small data-i18n="globalMarkets"></small><strong>195+</strong><span class="sub" data-i18n="countriesMarkets"></span></div></div>
    <div class="stat"><span class="stat-icon">◉</span><div><small data-i18n="systemStatus"></small><strong id="onlineState">—</strong><span class="sub" id="healthSmall">—</span></div></div>
    <div class="stat"><span class="stat-icon">✧</span><div><small>NOVA AI</small><strong id="aiState">—</strong><span class="sub" data-i18n="negotiationAnalysis"></span></div></div>
  </div>

  <div class="section">
    <div class="section-head"><div><h2 data-i18n="sectors"></h2><p data-i18n="chooseSector"></p></div></div>
    <div class="categories" id="categories"></div>
  </div>

  <div class="section">
    <div class="section-head"><div><h2 data-i18n="globalOpportunities"></h2><p data-i18n="marketSubtitle"></p></div><button class="btn secondary" onclick="go('search')" data-i18n="explore"></button></div>
    <div class="market-grid">
      <article class="market-card"><div class="market-art">🌾</div><div><strong data-i18n="wheat"></strong><p class="muted" data-i18n="marketHint"></p></div></article>
      <article class="market-card"><div class="market-art">🥬</div><div><strong data-i18n="food"></strong><p class="muted" data-i18n="marketHint"></p></div></article>

  try { return new Intl.DisplayNames([currentLang], {type:"region"}); }
  catch { return null; }
})();

function tr(key) {
  return (TEXT[currentLang] && TEXT[currentLang][key]) ||
         TEXT.en[key] || key;
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function toast(message, type="") {
  const el=$("toast");
  el.textContent=message;
  el.className="toast show "+type;
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.className="toast",4000);
}
function setStatus(id,message,type="") {
  const el=$(id);
  if(!el)return;
  el.textContent=message||"";
  el.className="status "+type;
}
function money(value,currency="USD") {
  if(value===null||value===undefined||value==="") return tr("unknown");
  const n=Number(value);
  if(!Number.isFinite(n))return esc(value);
  try{return new Intl.NumberFormat(currentLang==="ar"?"ar-IQ":"en-US",{style:"currency",currency,maximumFractionDigits:2}).format(n);}
  catch{return `${n.toLocaleString()} ${currency}`;}
}
function fmt(value) {
  if(value===null||value===undefined||value==="")return tr("unknown");
  const n=Number(value);
  return Number.isFinite(n)?new Intl.NumberFormat(currentLang==="ar"?"ar-IQ":"en-US",{maximumFractionDigits:2}).format(n):esc(value);
}
function countryName(code) {
  if(!code)return tr("allCountries");
  try {
    const names=new Intl.DisplayNames([currentLang==="ar"?"ar":"en"],{type:"region"});
    return names.of(code)||code;
  } catch {return code;}
}
function populateCountries() {
  const ids=["homeCountry","countryExplorer","destination","rfqDestination"];
  const old={};
  ids.forEach(id=>{if($(id))old[id]=$(id).value;});
  const options=`<option value="">${esc(tr("allCountries"))}</option>`+
    COUNTRY_CODES.map(code=>`<option value="${esc(code)}">${esc(countryName(code))}</option>`).join("");
  ids.forEach(id=>{
    const el=$(id);if(!el)return;
    el.innerHTML=options;
    if(old[id])el.value=old[id];
  });
}
function applyLanguage() {
  document.documentElement.lang=currentLang;
  document.documentElement.dir=currentLang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=tr(el.dataset.i18n));
  document.querySelectorAll("[data-placeholder]").forEach(el=>el.placeholder=tr(el.dataset.placeholder));
  $("language").value=currentLang;
  populateCountries();
  renderCategories();
  document.title=currentLang==="ar"?"NOVA — المشتريات العالمية بالذكاء الاصطناعي":"NOVA — Global Procurement AI";
}
$("language").addEventListener("change",e=>{
  currentLang=e.target.value==="en"?"en":"ar";
  try{localStorage.setItem("nova_language",currentLang);}catch{}
  applyLanguage();
});
try {
  const saved=localStorage.getItem("nova_language");

} catch {}

const CATEGORIES=[
  ["🌾","wheat","wheat grain bulk supplier"],
  ["🥬","food","food products manufacturer supplier"],
  ["🏭","materials","industrial materials manufacturer"],
  ["🚜","machinery","agricultural machinery manufacturer"],
  ["🚗","vehicles","vehicle manufacturer exporter"],
  ["⚙️","industry","industrial equipment supplier"],
  ["🏘️","realEstate","commercial real estate"],
  ["🚢","logistics","international freight logistics"]
];
function renderCategories() {
  const el=$("categories");if(!el)return;
  el.innerHTML=CATEGORIES.map(([icon,key,q])=>`
    <button class="cat" data-query="${esc(q)}">
      <div class="cat-art">${icon}</div><span>${esc(tr(key))}</span>
    </button>`).join("");
  el.querySelectorAll("[data-query]").forEach(b=>b.addEventListener("click",()=>quickSearch(b.dataset.query)));
}

  document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  $("nav").classList.remove("open");
  window.scrollTo({top:0,behavior:"smooth"});
  if(page==="deals")loadDeals();
  if(page==="history")loadPurchases();
  if(page==="account")checkAccount();
}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function toggleNav(){$("nav").classList.toggle("open");}

async function api(path,options={}) {
  const opts={...options,credentials:"same-origin",headers:{
    "Accept":"application/json",
    ...(options.body?{"Content-Type":"application/json"}:{}),
    ...(options.headers||{})
  }};
  let response;
  try{response=await fetch(path,opts);}
  catch{throw new Error(tr("networkError"));}
  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{};}catch{
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    throw new Error("Invalid server response");
  }
  if(!response.ok||data.error)throw new Error(data.error||`HTTP ${response.status}`);
  return data;
}
function setBusy(id,busy) {
  const el=$(id);if(!el)return;
  el.disabled=busy;
  if(busy){el.dataset.oldText=el.textContent;el.textContent=tr("loading");}
  else if(el.dataset.oldText){el.textContent=el.dataset.oldText;delete el.dataset.oldText;}
}
function homeSearch() {
  $("query").value=$("homeQuery").value.trim();
  $("destination").value=$("homeCountry").value;
  go("search");searchSuppliers();
}
function quickSearch(query) {
  $("homeQuery").value=query;
  $("query").value=query;
  $("destination").value=$("homeCountry").value;
  go("search");searchSuppliers();
}
function clearSearch() {
  $("query").value="";$("quantity").value="";
  $("destination").value="";$("results").innerHTML="";
  setStatus("searchStatus","");
}
function extractResults(data) {
  if(Array.isArray(data))return data;
  for(const key of ["suppliers","results","items","organic","data","records"]) {
    if(Array.isArray(data?.[key]))return data[key];
  }
  return [];
}
function supplierCard(s,i) {
  const name=s.company||s.name||s.title||s.supplier||tr("unknown");
  const url=s.url||s.link||s.source_url||s.website||"";
  const country=s.country||s.location||"";
  const price=s.price??s.unit_price??s.cost;
  const description=s.description||s.snippet||s.summary||"";
  const quantity=s.moq??s.minimum_order_quantity;
  return `<article class="result">
    <div class="result-top"><div class="avatar">${["🏭","🌾","⚙️","🚢"][i%4]}</div>
      <div><h3>${esc(name)}</h3><div class="muted">${esc(country||tr("noCountry"))}</div>
      ${url?`<span class="pill">● ${esc(tr("source"))}</span>`:""}</div>
    </div>
    ${description?`<p>${esc(description)}</p>`:`<p class="muted">${esc(tr("noDescription"))}</p>`}
    <div class="metrics">
      <div class="metric"><small>${esc(tr("price"))}</small><b>${price!==undefined&&price!==null?esc(typeof price==="number"?money(price,s.currency||"USD"):price):esc(tr("noPrice"))}</b></div>
      <div class="metric"><small>${esc(tr("moq"))}</small><b>${esc(fmt(quantity))}</b></div>
    </div>
    ${url&&/^https?:\/\//i.test(url)?`<a class="source-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(tr("source"))}</a>`:""}
    <div class="actions"><button class="btn secondary" data-rfq="${esc(name)}" data-product="${esc($("query").value)}">${esc(tr("createRFQ"))}</button>
    <button class="btn ghost" data-negotiate="${esc(name)}" data-price="${esc(price??"")}">${esc(tr("startNegotiation"))}</button></div>
  </article>`;
}
async function searchSuppliers() {
  const request=$("query").value.trim();
  const quantity=Number($("quantity").value)||0;
  const destination=$("destination").value;
  if(!request){toast(tr("productRequired"),"error");return;}
  $("results").innerHTML=`<div class="empty"><span class="loading"></span> ${esc(tr("loading"))}</div>`;
  setStatus("searchStatus","");
  setBusy("searchBtn",true);
  try {
    const data=await api("/api/search",{method:"POST",body:JSON.stringify({request,quantity,destination})});
    const results=extractResults(data);
    if(!results.length){
      $("results").innerHTML=`<div class="panel empty">${esc(tr("noResults"))}</div>`;
      setStatus("searchStatus",data.message||tr("noResults"));
      return;
    }
    $("results").innerHTML=`<div class="section-head"><h2>${esc(tr("results"))} (${results.length})</h2></div>`+
      results.map(supplierCard).join("");
    $("results").querySelectorAll("[data-rfq]").forEach(b=>b.addEventListener("click",()=>{
      $("rfqProduct").value=b.dataset.product||request;
      $("rfqQuantity").value=quantity||"";
      $("rfqDestination").value=destination||"";
      go("rfq");
    }));
    $("results").querySelectorAll("[data-negotiate]").forEach(b=>b.addEventListener("click",()=>{
      $("negSupplier").value=b.dataset.negotiate;
      $("negOffer").value=Number(b.dataset.price)||"";
      $("negQuantity").value=quantity||500;
      go("negotiation");
    }));
    setStatus("searchStatus",data.message||"", "success");
  } catch(e) {
    $("results").innerHTML=`<div class="panel empty">${esc(e.message)}</div>`;
    setStatus("searchStatus",e.message,"error");
  } finally {setBusy("searchBtn",false);}
}
async function createRFQ() {
  const product=$("rfqProduct").value.trim();
  const quantity=Number($("rfqQuantity").value);
  if(!product){toast(tr("productRequired"),"error");return;}
  if(!quantity||quantity<1){toast(tr("quantityRequired"),"error");return;}
  setBusy("rfqBtn",true);setStatus("rfqStatus",tr("loading"));
  $("rfqOutput").textContent="";
  try {
    const data=await api("/api/rfq",{method:"POST",body:JSON.stringify({
      product,quantity,destination:$("rfqDestination").value,
      incoterm:$("rfqIncoterm").value,requirements:$("rfqRequirements").value.trim()
    })});
    setStatus("rfqStatus",tr("rfqSuccess"),"success");
    const content=data.rfq||data.result||data.text||data.message||data;
    $("rfqOutput").textContent=typeof content==="string"?content:JSON.stringify(content,null,2);
  } catch(e) {setStatus("rfqStatus",e.message,"error");}
  finally{setBusy("rfqBtn",false);}
}
async function calculateLanded() {
  const b={
    unitPrice:Number($("unitPrice").value),
    quantity:Number($("landedQuantity").value),
    shipping:Number($("shipping").value)||0,
    insurance:Number($("insurance").value)||0,
    duty:Number($("duty").value)||0,
    tax:Number($("tax").value)||0,
    localDelivery:Number($("localDelivery").value)||0
  };
  if(!Number.isFinite(b.unitPrice)||b.unitPrice<0||!b.quantity||b.quantity<1){
    setStatus("landedOutput",tr("invalidInput"),"error");return;
  }
  setBusy("landedBtn",true);setStatus("landedOutput",tr("loading"));
  try {
    const d=await api("/api/landed-cost",{method:"POST",body:JSON.stringify(b)});
    const v=d.result||d;
    const fields=[
      ["goods",v.goods??v.goodsValue],
      ["shipping",v.shipping],
      ["insurance",v.insurance],
      ["duty",v.duty],
      ["tax",v.tax],
      ["localDelivery",v.localDelivery??v.local_delivery],
      ["landedTotal",v.total??v.landedCost??v.landed_cost],
      ["unitLanded",v.unitLanded??v.unit_landed]
    ].filter(([,x])=>x!==undefined&&x!==null);
    $("landedOutput").className="status";
    $("landedOutput").innerHTML=`<div class="panel"><div class="panel-head"><h3>${esc(tr("landedTotal"))}</h3></div><div class="panel-body"><div class="metrics">${fields.map(([k,val])=>`<div class="metric"><small>${esc(tr(k)||k)}</small><b>${esc(money(val))}</b></div>`).join("")}</div></div></div>`;
    if(!fields.length)$("landedOutput").textContent=JSON.stringify(d,null,2);
  } catch(e) {setStatus("landedOutput",e.message,"error");}
  finally{setBusy("landedBtn",false);}
}
async function negotiate() {
  const supplier=$("negSupplier").value.trim();
  const offer=Number($("negOffer").value);
  const target=Number($("negTarget").value)||0;
  const quantity=Number($("negQuantity").value)||1;
  const reply=$("negReply").value.trim();
  if(!supplier||!offer||offer<0){toast(tr("invalidInput"),"error");return;}
  setBusy("negBtn",true);setStatus("negOutput",tr("loading"));
  try {
    const d=await api("/api/negotiate",{method:"POST",body:JSON.stringify({supplier,offer,target,quantity,reply})});
    const result=d.result??d.analysis??d;
    $("negOutput").className="status";
    $("negOutput").textContent=typeof result==="string"?result:JSON.stringify(result,null,2);
  } catch(e) {setStatus("negOutput",e.message,"error");}
  finally{setBusy("negBtn",false);}
}
async function loadDeals() {
  $("dealsOutput").innerHTML=`<div class="empty"><span class="loading"></span> ${esc(tr("loading"))}</div>`;
  try {
    const d=await api("/api/deals");
    const deals=Array.isArray(d.deals)?d.deals:[];
    if(!deals.length){$("dealsOutput").textContent=tr("noDeals");return;}
    $("dealsOutput").innerHTML=deals.map(x=>`
      <article class="result"><div class="result-top"><div class="avatar">🔥</div><div>
      <h3>${esc(x.product||tr("unknown"))}</h3><div class="muted">${esc(x.company||tr("unknown"))} · ${esc(x.country||"")}</div></div></div>
      <p>${esc(x.description||"")}</p><div class="metrics">
      <div class="metric"><small>${esc(tr("price"))}</small><b>${esc(x.price!=null?money(x.price,x.currency||"USD"):tr("unknown"))}</b></div>
      <div class="metric"><small>${esc(tr("moq"))}</small><b>${esc(fmt(x.moq))}</b></div></div>
      ${x.url&&/^https?:\/\//i.test(x.url)?`<a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(tr("source"))}</a>`:""}</article>`).join("");
  } catch(e){$("dealsOutput").textContent=e.message;}
}
async function loadPurchases() {
  $("historyOutput").innerHTML=`<div class="empty"><span class="loading"></span> ${esc(tr("loading"))}</div>`;
  try {
    const d=await api("/api/purchases");
    const rows=Array.isArray(d.purchases)?d.purchases:[];
    if(!rows.length){$("historyOutput").textContent=tr("noPurchases");return;}
    $("historyOutput").innerHTML=rows.map(x=>`
      <article class="result"><div class="result-top"><div class="avatar">🧾</div><div>
      <h3>${esc(x.product||tr("unknown"))}</h3><div class="muted">${esc(x.supplier||tr("unknown"))}</div></div></div>
      <div class="metrics">
      <div class="metric"><small>${esc(tr("quantity"))}</small><b>${esc(fmt(x.quantity))}</b></div>
      <div class="metric"><small>${esc(tr("unitPrice"))}</small><b>${esc(money(x.unit_price))}</b></div>
      <div class="metric"><small>${esc(tr("shipping"))}</small><b>${esc(money(x.shipping))}</b></div>
      <div class="metric"><small>${esc(tr("landedTotal"))}</small><b>${esc(money(x.landed_cost))}</b></div>
      </div></article>`).join("");
  } catch(e){$("historyOutput").textContent=e.message;}
}
function credentials(){return {email:$("email").value.trim(),password:$("password").value};}
async function login() {
  const b=credentials();
  if(!b.email||!b.password){toast(tr("invalidInput"),"error");return;}
  try{const d=await api("/api/login",{method:"POST",body:JSON.stringify(b)});
    $("password").value="";setStatus("accountOutput",`${tr("loggedIn")}: ${d.email||b.email}`,"success");toast(tr("loggedIn"),"success");
  }catch(e){setStatus("accountOutput",e.message,"error");}
}
async function signup() {
  const b=credentials();
  if(!b.email||b.password.length<6){toast(tr("invalidInput"),"error");return;}
  try{const d=await api("/api/signup",{method:"POST",body:JSON.stringify(b)});
    $("password").value="";setStatus("accountOutput",`${tr("loggedIn")}: ${d.email||b.email}`,"success");toast(tr("loggedIn"),"success");
  }catch(e){setStatus("accountOutput",e.message,"error");}
}
async function logout() {
  try{await api("/api/logout",{method:"POST"});setStatus("accountOutput",tr("loggedOut"),"success");}
  catch(e){setStatus("accountOutput",e.message,"error");}
}
async function checkAccount() {
  try{const d=await api("/api/me");
    if(d.loggedIn&&d.user)setStatus("accountOutput",`${tr("loggedIn")}: ${d.user.email||""}`,"success");
    else setStatus("accountOutput",tr("loginFirst"));
  }catch(e){setStatus("accountOutput",e.message,"error");}
}
function healthValue(id,value) {
  $(id).textContent=value?tr("connected"):tr("notConnected");
  $(id).className=value?"connected":"disconnected";
}
async function checkHealth() {
  try {
    const d=await api("/api/health");
    healthValue("healthNova",Boolean(d.ok));
    healthValue("healthDB",Boolean(d.database));
    healthValue("healthAI",Boolean(d.ai));
    healthValue("healthSearch",Boolean(d.yep));
    $("onlineState").textContent=d.ok?tr("online"):tr("offline");
    $("onlineState").className=d.ok?"connected":"disconnected";
    $("aiState").textContent=d.ai?tr("online"):tr("offline");
    $("aiState").className=d.ai?"connected":"disconnected";
    $("healthSmall").textContent=d.database?tr("connected"):tr("notConnected");
  } catch {
    ["healthNova","healthDB","healthAI","healthSearch"].forEach(id=>healthValue(id,false));
    $("onlineState").textContent=tr("offline");$("onlineState").className="disconnected";
    $("aiState").textContent=tr("offline");$("aiState").className="disconnected";
    $("healthSmall").textContent=tr("notConnected");
  }
}
async function loadNetwork() {
  try {
    const d=await api("/api/network");
    $("networkRecords").textContent=fmt(Number(d.actualRecords||0));
  } catch {$("networkRecords").textContent="—";}
}
function closeModal(){$("modal").classList.remove("open");}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

async function initNOVA() {
  applyLanguage();
  await Promise.allSettled([checkHealth(),loadNetwork()]);
}
initNOVA();
